<title>誰是知識王</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root{
    --void:#04050A; --hair:#ffffff14; --hair2:#ffffff26;
    --ink:#EAEEF8; --dim:#8992A8; --dim2:#5A6178;
    --cy:#22F5DC; --vi:#B84DFF; --red:#FF3D63; --blue:#3B9CFF; --gold:#FFC93B; --green:#2FE39B;
    --silver:#CBD5E6; --prism:#FF6EE0;
    --disp:"Rajdhani","Noto Sans TC",system-ui,sans-serif;
    --body:"Noto Sans TC",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--void);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
  .amb{position:fixed;inset:0;z-index:0;pointer-events:none;background:
    radial-gradient(880px 600px at 16% 6%,#123c33 0%,transparent 62%),
    radial-gradient(820px 600px at 86% 20%,#2b1240 0%,transparent 64%),
    radial-gradient(700px 700px at 50% 110%,#191033 0%,transparent 60%),var(--void)}
  .amb:after{content:"";position:absolute;inset:0;background-image:
    linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);
    background-size:34px 34px;mask-image:radial-gradient(70% 60% at 50% 40%,#000 0%,transparent 78%)}

  .app{position:relative;z-index:1;width:100%;max-width:430px;min-height:100vh;padding:16px 14px 22px;
    display:flex;flex-direction:column;gap:10px}
  .scan{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:repeating-linear-gradient(#ffffff08 0 1px,transparent 1px 3px);opacity:.45;mix-blend-mode:overlay}

  h1{font-family:var(--disp);font-size:40px;font-weight:700;text-align:center;margin:26px 0 4px;letter-spacing:.01em}
  h1 b{color:var(--cy);text-shadow:0 0 26px #22f5dc55}
  .sub{text-align:center;color:var(--dim);font-size:13px;margin:0 0 18px}
  .card{border:1px solid var(--hair);border-radius:14px;padding:13px 15px;background:linear-gradient(#0E1120,#0A0C16);
    box-shadow:inset 0 1px 0 #ffffff0d}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  label{font-family:var(--mono);font-size:10px;color:var(--dim2);letter-spacing:.1em;display:block;margin-bottom:5px}
  input[type=text]{width:100%;font-family:var(--body);font-size:16px;color:var(--ink);background:#0a0c16;
    border:1px solid var(--hair);border-radius:10px;padding:11px 13px}
  input[type=text]:focus{outline:none;border-color:#1c4a48}
  .btn{border:1px solid #22F5DC55;border-radius:12px;padding:13px;cursor:pointer;font-family:var(--disp);
    font-size:17px;font-weight:700;letter-spacing:.04em;color:#B9FFF5;background:linear-gradient(#0b2e2c,#071c1d);
    box-shadow:0 0 26px -12px var(--cy),inset 0 1px 0 #ffffff20;width:100%;transition:transform .12s}
  .btn small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:#68B8B0;font-weight:400;margin-top:2px}
  .btn.gold{border-color:#FFC93B66;color:#FFE6A6;background:linear-gradient(#3a2b08,#241905);box-shadow:0 0 26px -12px var(--gold)}
  .btn.gold small{color:#C9A961}
  .btn.ghost{border-color:var(--hair2);background:#141830;color:var(--dim);box-shadow:none}
  .btn.vio{border-color:#7B2FB566;color:#F0D2FF;background:linear-gradient(#2a1040,#180a26);box-shadow:0 0 26px -12px var(--vi)}
  .btn:disabled{opacity:.35;cursor:default;box-shadow:none}
  .btn:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
  @media(prefers-reduced-motion:no-preference){.btn:active{transform:scale(.985)}}

  .hud{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .pill{font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--hair);
    background:#0c0f1c;border-radius:20px;padding:4px 9px;white-space:nowrap}
  .pill b{color:var(--ink)}
  .hexbadge{display:flex;align-items:center;gap:7px}
  .hex{width:26px;height:29px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
    background:linear-gradient(#1d2340,#101426);display:grid;place-items:center;font-size:12px}
  .hexbadge .t{font-family:var(--disp);font-size:15px;font-weight:600;line-height:1}
  .hexbadge .s{font-family:var(--mono);font-size:9px;color:var(--dim2)}

  .scores{display:flex;flex-direction:column;gap:5px}
  .srow{display:flex;align-items:center;gap:8px;font-size:12.5px;position:relative}
  .srow.me:before{content:"";position:absolute;left:-13px;top:1px;bottom:1px;width:2px;border-radius:2px;
    background:var(--cy);box-shadow:0 0 10px var(--cy)}
  .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .srow .val{margin-left:auto;font-family:var(--disp);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
  .neg{color:var(--red)}
  .mini{font-family:var(--mono);font-size:9px;color:var(--dim2);border:1px solid var(--hair);border-radius:4px;padding:0 5px}

  .stage{display:flex;align-items:center;justify-content:space-between;gap:8px;
    border:1px solid var(--hair);border-radius:11px;padding:8px 12px;background:#0b0e19}
  .stage.turn{border-color:#FFC93B66;background:linear-gradient(#241a05,#12100a);box-shadow:0 0 22px -12px var(--gold)}
  .stage .lb{font-family:var(--disp);font-size:14.5px;font-weight:600}
  .stage.turn .lb{color:var(--gold)}
  .stage .sb{font-family:var(--mono);font-size:9px;color:var(--dim2);display:block;font-weight:400}
  .stage .tm{font-family:var(--disp);font-size:22px;font-weight:700;color:var(--cy);font-variant-numeric:tabular-nums}
  .stage .tm.hot{color:var(--red)}

  .chipwrap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .chip{position:relative;width:100%;aspect-ratio:1;border-radius:50%;cursor:pointer;border:3px dashed #ffffff2e;
    background:radial-gradient(circle at 50% 38%,#1d2338,#0e1221 72%);display:grid;place-items:center;
    font-family:var(--disp);font-size:15px;font-weight:700;color:#9AA5BC;transition:transform .14s,box-shadow .2s,border-color .2s,color .2s}
  .chip:after{content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid #ffffff12}
  .chip.t1{border-color:#CBD5E655;color:var(--silver)} .chip.t2{border-color:#8FC0FF55;color:#8FC0FF}
  .chip.t3{border-color:#3B9CFF66;color:var(--blue)} .chip.t4{border-color:#2FE39B66;color:var(--green)}
  .chip.t5{border-color:#E0C24A77;color:#E0C24A}
  .chip.t6{border-color:#FFC93B99;color:var(--gold);background:radial-gradient(circle at 50% 38%,#2a2008,#150f03 72%)}
  .chip.sel{transform:translateY(-6px) scale(1.04);box-shadow:0 12px 26px -10px #000,0 0 0 2px #22f5dc66,0 0 24px -6px var(--cy)}
  .chip:disabled{cursor:default;opacity:.35}

  .board{display:flex;gap:8px}
  .bcard{flex:1;border:1px solid var(--hair);border-radius:11px;padding:8px 10px;text-align:center;background:#0b0e19}
  .bcard .who{font-family:var(--mono);font-size:9px;letter-spacing:.1em}
  .bcard .amt{font-family:var(--disp);font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
  .bcard .st{font-family:var(--mono);font-size:8.5px;color:var(--dim2)}
  .bcard.lead{border-color:#FFC93B66;box-shadow:0 0 20px -12px var(--gold)}
  .bcard.folded{opacity:.42}

  .log{border-top:1px dashed #ffffff12;border-bottom:1px dashed #ffffff12;padding:6px 2px;min-height:44px;
    display:flex;flex-direction:column;gap:2px}
  .log .l{font-family:var(--mono);font-size:9.5px;color:var(--dim2)}
  .log .l b{color:var(--ink)} .log .l.r{color:#FFD98A} .log .l.b{color:#A9D6FF}

  .timer{position:relative;width:60px;height:60px;flex:none}
  .timer svg{transform:rotate(-90deg);display:block}
  .timer .tn{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);
    font-size:22px;font-weight:700;color:var(--cy);font-variant-numeric:tabular-nums}
  .timer.hot .tn{color:var(--red)}
  .qzone{display:flex;gap:12px;align-items:flex-start}
  .q{font-size:15.5px;line-height:1.5;font-weight:500;padding-top:2px}

  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{position:relative;display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;width:100%;
    border:1px solid var(--hair);background:linear-gradient(#0f1322,#0b0e19);color:var(--ink);
    font-family:var(--body);font-size:14px;text-align:left;
    clip-path:polygon(0 0,calc(100% - 13px) 0,100% 13px,100% 100%,13px 100%,0 calc(100% - 13px));
    transition:transform .12s,background .18s,border-color .18s}
  .opt .idx{font-family:var(--disp);font-size:13px;font-weight:700;color:var(--dim2);width:14px;flex:none}
  .opt .txt{flex:1}
  .opt .avs{display:flex;gap:3px;margin-left:auto}
  .opt.sel{border-color:#22f5dc80;background:linear-gradient(#0c2b2c,#0a1c22);box-shadow:0 0 22px -10px var(--cy)}
  .opt.sel .idx{color:var(--cy)}
  .opt.ok{border-color:#2fe39b90;background:linear-gradient(#0a2a20,#081a16)}
  .opt.ok .idx{color:var(--green)}
  .opt.no{border-color:#ff3d6390;background:linear-gradient(#2a0d16,#190810)}
  .opt.no .idx{color:var(--red)}
  .opt.gone{opacity:.28;text-decoration:line-through}
  .opt:disabled{cursor:default}
  @media(prefers-reduced-motion:no-preference){
    .opt:active{transform:scale(.985)}
    .opt.shake{animation:shk .34s}
    @keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
  }
  .av{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);
    font-size:11px;font-weight:700;color:#05060c}
  .av.r{background:var(--red)} .av.b{background:var(--blue)}
  .av.cap{box-shadow:0 0 0 2px #080a12,0 0 0 3.5px var(--cy)}

  .votes{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:10px;
    color:var(--dim2);border-top:1px dashed #ffffff12;border-bottom:1px dashed #ffffff12;padding:7px 2px}
  .votes b{color:var(--cy)}

  .icard{border-radius:11px;padding:10px 12px;border:1px solid #8A2F7660;text-align:left;width:100%;cursor:pointer;
    background:linear-gradient(120deg,#26102c,#140816 60%,#1e0f28);color:var(--ink);font-family:var(--body);
    position:relative;overflow:hidden}
  .icard.sv{border-color:#8794AA66;background:linear-gradient(120deg,#1a1f2b,#0d1017)}
  .icard.gd{border-color:#7a5c1499;background:linear-gradient(120deg,#241c07,#120e04)}
  .icard .rar{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;font-weight:600}
  .icard.pr .rar{background:linear-gradient(90deg,#FF6EE0,#7FE0FF,#FFD36E);-webkit-background-clip:text;background-clip:text;color:transparent}
  .icard.sv .rar{color:var(--silver)} .icard.gd .rar{color:var(--gold)}
  .icard .nm{font-family:var(--disp);font-size:15px;font-weight:700;margin-top:1px}
  .icard .de{font-size:11px;color:#C9AFD8;line-height:1.45;margin-top:2px}
  .icard.sv .de,.icard.gd .de{color:var(--dim)}
  .icard:disabled{opacity:.45;cursor:default}

  .prism{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0;mix-blend-mode:screen;
    background:linear-gradient(115deg,#FF6EE0,#7FE0FF 28%,#FFD36E 52%,#8CFFC1 74%,#FF6EE0);background-size:280% 280%}
  .prism.show{animation:pfx 1.4s ease-out}
  @keyframes pfx{0%{opacity:0;background-position:0 0}14%{opacity:.85}55%{opacity:.45}100%{opacity:0;background-position:100% 100%}}
  .flash{position:fixed;inset:0;z-index:55;pointer-events:none;opacity:0}
  .flash.ok{background:radial-gradient(60% 40% at 50% 46%,#2fe39b3d,transparent 72%)}
  .flash.no{background:radial-gradient(60% 40% at 50% 46%,#ff3d633d,transparent 72%)}
  .flash.show{animation:fl .9s ease-out}
  @keyframes fl{0%{opacity:1}100%{opacity:0}}
  .delta{position:fixed;left:50%;top:38%;transform:translateX(-50%);z-index:58;pointer-events:none;
    font-family:var(--disp);font-size:36px;font-weight:700;opacity:0;white-space:nowrap}
  .delta.show{animation:rise 1.5s ease-out}
  @keyframes rise{0%{opacity:0;transform:translate(-50%,10px) scale(.9)}18%{opacity:1}100%{opacity:0;transform:translate(-50%,-38px) scale(1.04)}}

  .wheel{width:150px;height:150px;border-radius:50%;margin:6px auto;position:relative;
    background:conic-gradient(#151828 0 36deg,#1d2033 36deg 72deg,#151828 72deg 108deg,#2a1a3c 108deg 144deg,
      #151828 144deg 180deg,#1d2033 180deg 216deg,#151828 216deg 252deg,#1d2033 252deg 288deg,#151828 288deg 324deg,#3a2a12 324deg 360deg);
    border:1px solid var(--hair2);box-shadow:0 0 30px -10px var(--vi);transition:transform 1.8s cubic-bezier(.16,.9,.2,1)}
  .wheel:after{content:"";position:absolute;inset:34%;border-radius:50%;background:#0a0c16;border:1px solid var(--hair)}
  .wpin{text-align:center;color:var(--cy);font-size:13px;margin-bottom:-8px}
  .center{text-align:center}
  .big{font-family:var(--disp);font-size:30px;font-weight:700}
  .expl{font-size:12.5px;color:var(--dim);line-height:1.6;border-top:1px dashed #ffffff12;padding-top:8px;margin-top:2px}
  .hint{font-family:var(--mono);font-size:9px;color:var(--dim2);text-align:center;line-height:1.6}
  .hide{display:none!important}
  .mute{position:fixed;right:12px;top:12px;z-index:70;width:32px;height:32px;border-radius:9px;
    border:1px solid var(--hair);background:#0c0f1cdd;color:var(--dim);cursor:pointer;font-size:14px}
  .lrow{display:flex;align-items:center;gap:8px;border:1px solid var(--hair);border-radius:10px;padding:9px 11px;
    background:#0a0c16;font-size:13px}
  .lrow .pos{font-family:var(--disp);font-size:15px;color:var(--dim2);width:18px;font-weight:700}
  .lrow .sc{margin-left:auto;font-family:var(--disp);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
</style>

<div class="amb"></div><div class="scan"></div>
<div class="prism" id="prism"></div>
<div class="flash ok" id="flashOk"></div><div class="flash no" id="flashNo"></div>
<div class="delta" id="delta"></div>
<button class="mute" id="mute" aria-label="音效">🔊</button>

<div class="app" id="app">

  <!-- ===== 進入 ===== -->
  <section id="scr-start">
    <h1>誰是<b>知識王</b></h1>
    <p class="sub">單機試玩版 · 你是紅隊隊長，隊友與藍隊由電腦模擬</p>
    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <div><label>你的暱稱</label><input type="text" id="nick" maxlength="8" placeholder="小酒" value="小酒"></div>
      <div class="row">
        <div><label>回合數</label>
          <select id="rounds" style="width:100%;font-family:var(--body);font-size:15px;color:var(--ink);background:#0a0c16;border:1px solid var(--hair);border-radius:10px;padding:11px">
            <option value="6">6 回合（快速）</option>
            <option value="12" selected>12 回合（標準）</option>
          </select></div>
        <div><label>每隊人數</label>
          <select id="size" style="width:100%;font-family:var(--body);font-size:15px;color:var(--ink);background:#0a0c16;border:1px solid var(--hair);border-radius:10px;padding:11px">
            <option value="1">1 人（你自己一隊）</option>
            <option value="3" selected>3 人</option>
            <option value="4">4 人</option>
          </select></div>
      </div>
      <button class="btn" id="go">開始遊戲<small>起始 10,000 分 · 分數可為負</small></button>
    </div>
    <p class="hint" style="margin-top:14px">題庫 <b id="qcount"></b> 題 · 七個領域 · 四種難度<br>這一版用來驗證玩法，連線版之後接上 Firebase</p>
  </section>

  <!-- ===== 遊戲 ===== -->
  <section id="scr-game" class="hide">
    <div class="hud">
      <span class="pill">回合 <b id="rnd">1</b> / <b id="rndMax">12</b></span>
      <div class="hexbadge"><span class="hex" id="catIcon">?</span>
        <div><div class="t" id="catName">—</div><div class="s" id="catSub">難度未公布</div></div></div>
    </div>

    <div class="card scores" id="scoreBox"></div>

    <div class="stage" id="stage">
      <div><span class="lb" id="stageLb">準備開始</span><span class="sb" id="stageSb">—</span></div>
      <span class="tm" id="tm">—</span>
    </div>

    <!-- 下注 -->
    <div id="blkBet" class="hide" style="display:flex;flex-direction:column;gap:10px">
      <div class="chipwrap" id="chips"></div>
      <button class="btn" id="betOk">確認下注<small>隊長專屬 · 暗押後不可更改</small></button>
    </div>

    <!-- 叫價 -->
    <div id="blkBid" class="hide" style="display:flex;flex-direction:column;gap:10px">
      <div class="board" id="board"></div>
      <div class="log" id="log"></div>
      <div class="row" id="bidActs"></div>
    </div>

    <!-- 準備 / 卡片 -->
    <div id="blkPrep" class="hide" style="display:flex;flex-direction:column;gap:9px">
      <div id="handBox" style="display:flex;flex-direction:column;gap:8px"></div>
      <button class="btn ghost" id="prepSkip">不使用，直接進入作答</button>
    </div>

    <!-- 作答 -->
    <div id="blkQuiz" class="hide" style="display:flex;flex-direction:column;gap:10px">
      <div class="qzone">
        <div class="timer" id="timer">
          <svg width="60" height="60" viewBox="0 0 60 60" aria-hidden="true">
            <circle cx="30" cy="30" r="25" fill="none" stroke="#1a1f36" stroke-width="4"></circle>
            <circle id="ring" cx="30" cy="30" r="25" fill="none" stroke="#22F5DC" stroke-width="4"
              stroke-linecap="round" stroke-dasharray="157" stroke-dashoffset="0"></circle>
          </svg><div class="tn" id="tn">30</div>
        </div>
        <div class="q" id="qText">—</div>
      </div>
      <div class="opts" id="opts"></div>
      <div class="votes"><span>本隊 <b id="voteTxt">—</b></span><span id="oppTxt"></span></div>
      <button class="btn gold hide" id="submit">送出答案<small>隊長專屬 · 即刻以最高票定案</small></button>
      <div class="hint" id="quizHint"></div>
    </div>

    <!-- 結算 -->
    <div id="blkResult" class="hide" style="display:flex;flex-direction:column;gap:10px">
      <div class="card" id="resultBox"></div>
      <div id="wheelBox" class="hide center">
        <div class="wpin">▼</div><div class="wheel" id="wheel"></div>
        <div class="hint" id="wheelHint">答對抽獎 · 10 格中 2 格是功能卡</div>
      </div>
      <button class="btn" id="next">下一回合</button>
    </div>
  </section>

  <!-- ===== 結算 ===== -->
  <section id="scr-end" class="hide">
    <h1 style="font-size:30px">最終<b>結算</b></h1>
    <div class="card" id="endBox" style="display:flex;flex-direction:column;gap:8px"></div>
    <div class="card" id="statBox" style="margin-top:10px"></div>
    <button class="btn" id="again" style="margin-top:12px">再來一局</button>
  </section>
</div>

"}, {"id": "mat-e-003", "category": "數學", "difficulty": "easy", "question": "三角形的內角和是幾度？", "options": ["90 度", "180 度", "270 度", "360 度"], "answer": 1, "explain": "平面三角形內角和固定為 180 度。"}, {"id": "mat-e-004", "category": "數學", "difficulty": "easy", "question": "二分之一加四分之一等於多少？", "options": ["三分之一", "四分之三", "三分之二", "六分之一"], "answer": 1, "explain": "1/2 + 1/4 = 2/4 + 1/4 = 3/4。"}, {"id": "mat-e-005", "category": "數學", "difficulty": "easy", "question": "100 的 20% 是多少？", "options": ["2", "20", "200", "0.2"], "answer": 1, "explain": "100 × 0.2 = 20。"}, {"id": "mat-e-006", "category": "數學", "difficulty": "easy", "question": "最小的質數是哪一個？", "options": ["0", "1", "2", "3"], "answer": 2, "explain": "2 是最小的質數，也是唯一的偶質數；1 不是質數。"}, {"id": "mat-e-007", "category": "數學", "difficulty": "easy", "question": "一打（dozen）是幾個？", "options": ["10 個", "12 個", "16 個", "20 個"], "answer": 1, "explain": "一打等於 12 個。"}, {"id": "mat-e-008", "category": "數學", "difficulty": "easy", "question": "7 × 8 等於多少？", "options": ["48", "54", "56", "64"], "answer": 2, "explain": "7×8 = 56。"}, {"id": "mat-e-009", "category": "數學", "difficulty": "easy", "question": "圓周率取到小數點後兩位是多少？", "options": ["3.12", "3.14", "3.16", "3.18"], "answer": 1, "explain": "π ≈ 3.14159…，取兩位小數為 3.14。"}, {"id": "mat-e-010", "category": "數學", "difficulty": "easy", "question": "0 除以 5 等於多少？", "options": ["0", "1", "5", "無意義"], "answer": 0, "explain": "0 除以任何非零數都等於 0；但除以 0 才是沒有定義。"}, {"id": "mat-e-011", "category": "數學", "difficulty": "easy", "question": "一個正六邊形有幾條邊？", "options": ["5 條", "6 條", "7 條", "8 條"], "answer": 1, "explain": "正六邊形有 6 條邊、6 個頂點。"}, {"id": "mat-n-002", "category": "數學", "difficulty": "normal", "question": "2 的 5 次方等於多少？", "options": ["16", "25", "32", "64"], "answer": 2, "explain": "2⁵ = 2×2×2×2×2 = 32。"}, {"id": "mat-n-003", "category": "數學", "difficulty": "normal", "question": "某數的 25% 是 15，這個數是多少？", "options": ["45", "50", "60", "75"], "answer": 2, "explain": "15 ÷ 0.25 = 60。"}, {"id": "mat-n-004", "category": "數學", "difficulty": "normal", "question": "3、7、8、10、12 這五個數的平均是多少？", "options": ["7", "8", "9", "10"], "answer": 1, "explain": "總和 40 ÷ 5 = 8。"}, {"id": "mat-n-005", "category": "數學", "difficulty": "normal", "question": "一件衣服打八折後是 640 元，原價多少？", "options": ["720 元", "760 元", "800 元", "840 元"], "answer": 2, "explain": "640 ÷ 0.8 = 800 元。"}, {"id": "mat-n-006", "category": "數學", "difficulty": "normal", "question": "5 的階乘（5!）等於多少？", "options": ["60", "100", "120", "240"], "answer": 2, "explain": "5! = 5×4×3×2×1 = 120。"}, {"id": "mat-n-007", "category": "數學", "difficulty": "normal", "question": "半徑為 3 的圓，面積是多少？", "options": ["6π", "9π", "12π", "18π"], "answer": 1, "explain": "圓面積 = πr² = π×3² = 9π。"}, {"id": "mat-n-008", "category": "數學", "difficulty": "normal", "question": "1 公里等於幾公分？", "options": ["1,000 公分", "10,000 公分", "100,000 公分", "1,000,000 公分"], "answer": 2, "explain": "1 公里 = 1,000 公尺 = 100,000 公分。"}, {"id": "mat-n-009", "category": "數學", "difficulty": "normal", "question": "1 加到 10 的總和是多少？", "options": ["45", "50", "55", "60"], "answer": 2, "explain": "(1+10)×10÷2 = 55。"}, {"id": "mat-n-010", "category": "數學", "difficulty": "normal", "question": "直角三角形中，斜邊平方等於兩股平方和，這是什麼定理？", "options": ["歐拉定理", "畢氏定理", "餘弦定理", "海龍公式"], "answer": 1, "explain": "畢氏定理（勾股定理）：a² + b² = c²。"}, {"id": "mat-n-011", "category": "數學", "difficulty": "normal", "question": "一個立方體有幾個面？", "options": ["4 個", "6 個", "8 個", "12 個"], "answer": 1, "explain": "立方體有 6 個面、8 個頂點、12 條稜。"}, {"id": "mat-h-002", "category": "數學", "difficulty": "hard", "question": "1 加到 100 的總和是多少？", "options": ["4,950", "5,050", "5,500", "10,100"], "answer": 1, "explain": "(1+100)×100÷2 = 5,050。"}, {"id": "mat-h-003", "category": "數學", "difficulty": "hard", "question": "擲兩顆公正骰子，點數和為 7 的機率是多少？", "options": ["1/6", "1/8", "1/9", "1/12"], "answer": 0, "explain": "36 種等可能結果中有 6 種和為 7，機率 6/36 = 1/6，是所有點數和裡機率最高的。"}, {"id": "mat-h-004", "category": "數學", "difficulty": "hard", "question": "log₁₀ 1000 等於多少？", "options": ["2", "3", "10", "100"], "answer": 1, "explain": "10³ = 1000，所以 log₁₀1000 = 3。"}, {"id": "mat-h-005", "category": "數學", "difficulty": "hard", "question": "方程式 x² − 5x + 6 = 0 的兩根之和是多少？", "options": ["−5", "5", "6", "1"], "answer": 1, "explain": "根與係數關係：兩根和 = −b/a = 5（兩根為 2 與 3）。"}, {"id": "mat-h-006", "category": "數學", "difficulty": "hard", "question": "半徑為 6 的球，體積是多少？", "options": ["144π", "216π", "288π", "432π"], "answer": 2, "explain": "V = 4/3 πr³ = 4/3 × π × 216 = 288π。"}, {"id": "mat-h-007", "category": "數學", "difficulty": "hard", "question": "60 與 84 的最大公因數是多少？", "options": ["6", "12", "15", "24"], "answer": 1, "explain": "60 = 2²×3×5，84 = 2²×3×7，公因數取 2²×3 = 12。"}, {"id": "mat-h-008", "category": "數學", "difficulty": "hard", "question": "等比數列 2, 6, 18, … 的第 5 項是多少？", "options": ["54", "108", "162", "243"], "answer": 2, "explain": "公比 3：2, 6, 18, 54, 162。"}, {"id": "mat-h-009", "category": "數學", "difficulty": "hard", "question": "sin 30° 等於多少？", "options": ["1/2", "√2/2", "√3/2", "1"], "answer": 0, "explain": "sin30° = 1/2；cos30° 才是 √3/2。"}, {"id": "mat-h-010", "category": "數學", "difficulty": "hard", "question": "一個正十邊形的內角和是多少度？", "options": ["1,260 度", "1,440 度", "1,620 度", "1,800 度"], "answer": 1, "explain": "(10−2)×180 = 1,440 度。"}, {"id": "mat-h-011", "category": "數學", "difficulty": "hard", "question": "連續丟 3 次公正硬幣，至少出現一次正面的機率是多少？", "options": ["1/2", "5/8", "3/4", "7/8"], "answer": 3, "explain": "用反面思考：三次全是反面的機率為 (1/2)³ = 1/8，所以至少一次正面 = 1 − 1/8 = 7/8。"}, {"id": "mat-x-002", "category": "數學", "difficulty": "hell", "question": "C(10,3) 等於多少？", "options": ["30", "60", "120", "720"], "answer": 2, "explain": "10!/(3!×7!) = (10×9×8)/(3×2×1) = 120。"}, {"id": "mat-x-003", "category": "數學", "difficulty": "hell", "question": "8 個人互相握手一次，總共會握幾次手？", "options": ["16 次", "28 次", "36 次", "64 次"], "answer": 1, "explain": "C(8,2) = 28 次。"}, {"id": "mat-x-004", "category": "數學", "difficulty": "hell", "question": "36 有幾個正因數？", "options": ["6 個", "8 個", "9 個", "12 個"], "answer": 2, "explain": "36 = 2²×3²，因數個數 = (2+1)(2+1) = 9 個。"}, {"id": "mat-x-005", "category": "數學", "difficulty": "hell", "question": "1 到 100 的整數中，同時是 3 與 5 的倍數的有幾個？", "options": ["3 個", "5 個", "6 個", "10 個"], "answer": 2, "explain": "即 15 的倍數：15、30、45、60、75、90 共 6 個。"}, {"id": "mat-x-006", "category": "數學", "difficulty": "hell", "question": "袋子裡有 3 顆紅球與 2 顆藍球，連續抽出兩顆且不放回，兩顆都是紅球的機率是多少？", "options": ["3/10", "2/5", "9/25", "1/2"], "answer": 0, "explain": "第一顆抽到紅球 3/5，第二顆剩 2 紅 2 藍為 2/4，相乘 = 6/20 = 3/10。若是抽完放回才會是 9/25。"}, {"id": "mat-x-007", "category": "數學", "difficulty": "hell", "question": "某商品先漲價 20%，之後再打八折，最後售價與原價相比是？", "options": ["正好等於原價", "比原價便宜 4%", "比原價貴 4%", "比原價便宜 20%"], "answer": 1, "explain": "1.2 × 0.8 = 0.96，等於原價的 96%，所以便宜了 4%。漲跌百分比不能直接相加減，這是最常見的陷阱。"}, {"id": "mat-x-008", "category": "數學", "difficulty": "hell", "question": "時鐘顯示 3 點 30 分時，時針與分針的夾角是幾度？", "options": ["60 度", "75 度", "90 度", "105 度"], "answer": 1, "explain": "分針在 180°；時針走到 3×30 + 30×0.5 = 105°，兩者相差 75°。關鍵是時針在半小時內也會移動 15°。"}, {"id": "mat-x-009", "category": "數學", "difficulty": "hell", "question": "三邊長為 3、4、5 的三角形面積是多少？", "options": ["6", "7.5", "10", "12"], "answer": 0, "explain": "這是直角三角形，面積 = 3×4÷2 = 6。"}, {"id": "mat-x-010", "category": "數學", "difficulty": "hell", "question": "半徑為 r 的圓，其內接正方形面積是多少？", "options": ["r²", "2r²", "πr²", "4r²"], "answer": 1, "explain": "正方形對角線等於直徑 2r，面積 = (2r)²/2 = 2r²。"}, {"id": "mat-x-011", "category": "數學", "difficulty": "hell", "question": "0.999…（無限循環）等於多少？", "options": ["略小於 1", "恰好等於 1", "略大於 1", "無法確定"], "answer": 1, "explain": "在實數系統中 0.999… 與 1 是同一個數，可用 1/3 = 0.333… 兩邊乘 3 驗證。"}, {"id": "his-e-002", "category": "歷史", "difficulty": "easy", "question": "第二次世界大戰結束於西元哪一年？", "options": ["1943 年", "1944 年", "1945 年", "1946 年"], "answer": 2, "explain": "1945 年德國五月投降、日本八月宣布投降，二戰全面結束。"}, {"id": "his-e-003", "category": "歷史", "difficulty": "easy", "question": "改良造紙術的蔡倫是哪個朝代的人？", "options": ["西漢", "東漢", "唐朝", "宋朝"], "answer": 1, "explain": "蔡倫於東漢時期改良造紙技術，史稱「蔡侯紙」。"}, {"id": "his-e-004" culty": "hell", "question": "巴西的首都是哪一個城市？", "options": ["里約熱內盧", "聖保羅", "巴西利亞", "薩爾瓦多"], "answer": 2, "explain": "1960 年遷都至內陸新建的巴西利亞；里約是舊首都。"}, {"id": "geo-x-004", "category": "地理", "difficulty": "hell", "question": "台灣本島的最北端地標是？", "options": ["富貴角", "三貂角", "野柳岬", "鼻頭角"], "answer": 0, "explain": "富貴角位於新北市石門區，是台灣本島最北端；三貂角是最東端。"}, {"id": "geo-x-005", "category": "地理", "difficulty": "hell", "question": "哪一個國家被稱為「千湖之國」？", "options": ["瑞典", "芬蘭", "加拿大", "俄羅斯"], "answer": 1, "explain": "芬蘭境內湖泊逾十八萬個，因此有千湖之國之稱。"}, {"id": "geo-x-006", "category": "地理", "difficulty": "hell", "question": "南美洲最南端的著名海角是？", "options": ["好望角", "合恩角", "羅卡角", "北角"], "answer": 1, "explain": "合恩角位於智利南端；好望角在南非。"}, {"id": "geo-x-007", "category": "地理", "difficulty": "hell", "question": "世界上最大的珊瑚礁群「大堡礁」位於哪一個國家外海？", "options": ["印尼", "菲律賓", "澳洲", "斐濟"], "answer": 2, "explain": "大堡礁位於澳洲東北外海，全長約 2,300 公里。"}, {"id": "geo-x-008", "category": "地理", "difficulty": "hell", "question": "分隔台灣本島與菲律賓的海峽是？", "options": ["巴士海峽", "台灣海峽", "麻六甲海峽", "呂宋海峽"], "answer": 0, "explain": "巴士海峽位於台灣與菲律賓呂宋島之間。"}, {"id": "geo-x-009", "category": "地理", "difficulty": "hell", "question": "世界上面積最大的湖泊（含鹹水湖）是？", "options": ["蘇必略湖", "裏海", "維多利亞湖", "貝加爾湖"], "answer": 1, "explain": "裏海面積約 37 萬平方公里，是世界最大的湖泊。"}, {"id": "geo-x-010", "category": "地理", "difficulty": "hell", "question": "瑞士的首都是哪一個城市？", "options": ["蘇黎世", "日內瓦", "伯恩", "巴塞爾"], "answer": 2, "explain": "伯恩是瑞士的聯邦城市（首都）；蘇黎世是最大城市、日內瓦是國際組織所在地。"}, {"id": "acg-e-002", "category": "動漫", "difficulty": "easy", "question": "《航海王》中，主角魯夫吃下的惡魔果實是哪一種？", "options": ["橡膠果實", "燒燒果實", "暗暗果實", "手術果實"], "answer": 0, "explain": "魯夫在東海誤食橡膠果實成為橡膠人；燒燒是艾斯、暗暗是黑鬍子、手術是羅。"}, {"id": "acg-e-003", "category": "動漫", "difficulty": "easy", "question": "《名偵探柯南》中，工藤新一身體變小後使用的化名是？", "options": ["江戶川柯南", "毛利小五郎", "黑羽快斗", "服部平次"], "answer": 0, "explain": "他取自愛倫坡與柯南・道爾，化名江戶川柯南。"}, {"id": "acg-e-004", "category": "動漫", "difficulty": "easy", "question": "《寶可夢》動畫中，小智最著名的夥伴寶可夢是？", "options": ["皮卡丘", "小火龍", "傑尼龜", "妙蛙種子"], "answer": 0, "explain": "皮卡丘從第一集起就是小智的固定夥伴。"}, {"id": "acg-e-005", "category": "動漫", "difficulty": "easy", "question": "《七龍珠》中，孫悟空的真實種族是？", "options": ["地球人", "賽亞人", "那美克星人", "魔族"], "answer": 1, "explain": "孫悟空本名卡卡羅特，是被送到地球的賽亞人。"}, {"id": "acg-e-006", "category": "動漫", "difficulty": "easy", "question": "《蠟筆小新》的主角野原新之助設定上幾歲？", "options": ["3 歲", "5 歲", "7 歲", "9 歲"], "answer": 1, "explain": "小新是 5 歲的幼稚園生，就讀雙葉幼稚園向日葵班。"}, {"id": "acg-e-007", "category": "動漫", "difficulty": "easy", "question": "《灌籃高手》中，櫻木花道就讀的高中是？", "options": ["湘北高中", "陵南高中", "海南大附屬", "翔陽高中"], "answer": 0, "explain": "櫻木加入湘北高中籃球隊，是全作的主軸。"}, {"id": "acg-e-008", "category": "動漫", "difficulty": "easy", "question": "《美少女戰士》中，主角月野兔變身後的名稱是？", "options": ["水手月亮", "水手水星", "水手火星", "水手金星"], "answer": 0, "explain": "月野兔變身為水手月亮（Sailor Moon）。"}, {"id": "acg-e-009", "category": "動漫", "difficulty": "easy", "question": "《鬼滅之刃》的主角名字是？", "options": ["竈門炭治郎", "我妻善逸", "嘴平伊之助", "富岡義勇"], "answer": 0, "explain": "主角為竈門炭治郎，為了讓妹妹禰豆子變回人類而戰。"}, {"id": "acg-e-010", "category": "動漫", "difficulty": "easy", "question": "《進擊的巨人》中，人類居住區最外圍的城牆名稱是？", "options": ["瑪利亞之牆", "羅塞之牆", "希娜之牆", "希爾維亞之牆"], "answer": 0, "explain": "由外而內依序為瑪利亞、羅塞、希娜三道城牆。"}, {"id": "acg-n-001", "category": "動漫", "difficulty": "normal", "question": "《航海王》中，魯夫所率領的海賊團名稱是？", "options": ["草帽海賊團", "紅髮海賊團", "白鬍子海賊團", "百獸海賊團"], "answer": 0, "explain": "因魯夫戴著紅髮傑克贈送的草帽而得名。"}, {"id": "acg-n-002", "category": "動漫", "difficulty": "normal", "question": "《火影忍者》中，封印在漩渦鳴人體內的尾獸是？", "options": ["一尾", "三尾", "七尾", "九尾"], "answer": 3, "explain": "九尾妖狐（九喇嘛）在鳴人出生當天被封入他體內。"}, {"id": "acg-n-003", "category": "動漫", "difficulty": "normal", "question": "《死神 BLEACH》中，黑崎一護的斬魄刀名稱是？", "options": ["斬月", "千本櫻", "流刃若火", "冰輪丸"], "answer": 0, "explain": "斬月是一護的斬魄刀；千本櫻是朽木白哉、流刃若火是山本總隊長。"}, {"id": "acg-n-004", "category": "動漫", "difficulty": "normal", "question": "《鬼滅之刃》中，炭治郎最初學會的呼吸法是？", "options": ["水之呼吸", "炎之呼吸", "雷之呼吸", "日之呼吸"], "answer": 0, "explain": "炭治郎師從鱗瀧左近次，最初習得水之呼吸。"}, {"id": "acg-n-005", "category": function tone(f,d,type,g){ if(muted) return;
  try{ ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    var o=ctx.createOscillator(),gn=ctx.createGain();
    o.type=type||'triangle';o.frequency.value=f;gn.gain.value=0;o.connect(gn);gn.connect(ctx.destination);
    var n=ctx.currentTime;gn.gain.linearRampToValueAtTime(g||.06,n+.012);
    gn.gain.exponentialRampToValueAtTime(.0001,n+d);o.start(n);o.stop(n+d+.02);}catch(e){}}
function clink(){tone(1400,.05,'square',.03);setTimeout(function(){tone(980,.09,'triangle',.04);},40);}

function me(){return G.teams[0];} function opp(){return G.teams[1];}

var timerId=null,t=0;
function setTm(v,el){ t=v; var e=el||$('tm'); e.textContent=v<10?('0'+v):v; e.classList.toggle('hot',v<=3); }
function stopT(){clearInterval(timerId);}
function runT(sec,onEnd,el){ stopT(); setTm(sec,el);
  timerId=setInterval(function(){ setTm(t-1,el);
    if(t<=3&&t>0) tone(1180,.045,'square',.026);
    if(t<=0){stopT();onEnd&&onEnd();} },1000); }
function show(){ var ids=['blkBet','blkBid','blkPrep','blkQuiz','blkResult'];
  ids.forEach(function(i){$(i).classList.add('hide');});
  for(var k=0;k<arguments.length;k++) $(arguments[k]).classList.remove('hide'); }
function stage(lb,sb,turn){ $('stageLb').textContent=lb; $('stageSb').textContent=sb||'';
  $('stage').classList.toggle('turn',!!turn); }
function paintScores(){
  var h='';
  G.teams.forEach(function(T){
    h+='<div class="srow'+(T.me?' me':'')+'"><span class="dot" style="background:'+T.color+'"></span>'+
       '<span style="color:'+T.color+'">'+T.name+(T.me?'（你）':'')+'</span>'+
       (T.hand?'<span class="mini">手牌 1</span>':'')+
       '<span class="val'+(T.score<0?' neg':'')+'">'+fmt(T.score)+'</span></div>';
  });
  $('scoreBox').innerHTML=h;
}
function addLog(who,txt){
  var L=$('log'); var d=document.createElement('div');
  d.className='l '+(who==='r'?'r':who==='b'?'b':''); d.innerHTML=txt; L.appendChild(d);
  while(L.children.length>4) L.removeChild(L.firstChild);
}
function flash(ok){ var f=$(ok?'flashOk':'flashNo'); f.classList.add('show');
  setTimeout(function(){f.classList.remove('show');},950); }
function delta(txt,color){ var d=$('delta'); d.textContent=txt; d.style.color=color;
  d.classList.add('show'); setTimeout(function(){d.classList.remove('show');},1550); }
function prismFx(){ var p=$('prism'); p.classList.add('show');
  tone(92,.7,'sawtooth',.08); setTimeout(function(){tone(1320,.3,'triangle',.05);},150);
  setTimeout(function(){tone(1760,.5,'sine',.04);},300); buzz([40,30,40]);
  setTimeout(function(){p.classList.remove('show');},1450); }

/* ---------- 回合流程 ---------- */
var R=null;
function startRound(){
  if(G.round>G.max) return endGame();
  var q=null;
  while(G.pool.length){ var c=G.pool.pop(); if(!G.used[c.id]){q=c;break;} }
  if(!q){ G.pool=QB.slice(); shuffle(G.pool); q=G.pool.pop(); }
  G.used[q.id]=1;
  R={q:q,bets:{r:0,b:0},passed:{r:false,b:false},acted:{r:false,b:false},aiRaised:0,
     mode:'',myVote:-1,teamVote:-1,oppVote:-1,locked:false,removed:[],
     fx:{double:false,bullet:false,discount:false,immortal:false,lucky:false},submitted:false,answered:false};
  $('rnd').textContent=G.round; $('rndMax').textContent=G.max;
  $('catIcon').textContent=CAT_ICON[q.category]||'?';
  $('catName').textContent=q.category; $('catSub').textContent='難度未公布';
  paintScores(); $('log').innerHTML='';
  stage('公布領域','這回合考 '+q.category);
  show(); setTm(0);
  tone(520,.12); setTimeout(phaseBet,1400);
}
/* --- 暗押 --- */
function phaseBet(){
  stage('暗押中','只有隊長能碰籌碼 · 對手看不到');
  var h=''; TIERS.forEach(function(v,i){ h+='<button class="chip t'+(i+1)+'" data-v="'+v+'">'+v+'</button>'; });
  $('chips').innerHTML=h; $('betOk').disabled=false;
  Array.prototype.forEach.call($('chips').children,function(c){
    c.addEventListener('click',function(){
      if(R.bets.r) return;
      R.myPick=parseInt(c.dataset.v,10);
      Array.prototype.forEach.call($('chips').children,function(x){x.classList.remove('sel');});
      c.classList.add('sel'); clink(); buzz(12);
    });
  });
  show('blkBet');
  runT(10,function(){ if(!R.myPick) R.myPick=500; doReveal(); });
}
$('betOk').addEventListener('click',function(){
  if(!R.myPick){ tone(160,.14,'square',.04); buzz(20); return; }
  tone(196,.24,'sine',.07); buzz(30); doReveal();
});
function doReveal(){
  stopT(); R.bets.r=R.myPick||500;
  var pool=[500,1000,1000,1500,1500,2000,2000,2500,3000];
  R.bets.b=pool[Math.floor(Math.random()*pool.length)];
  $('betOk').disabled=true;
  Array.prototype.forEach.call($('chips').children,function(x){x.disabled=true;});
  stage('揭示','兩張注同時掀開');
  show('blkBid'); paintBoard(); clink(); buzz([18,40,18]);
  addLog('r','紅隊暗押 <b>'+fmt(R.bets.r)+'</b>'); addLog('b','藍隊暗押 <b>'+fmt(R.bets.b)+'</b>');
  setTm(0); setTimeout(nextTurn,1200);
}
function paintBoard(){
  var h='';
  G.teams.forEach(function(T){
    var mine=T.id==='r', v=R.bets[T.id], other=R.bets[mine?'b':'r'];
    var st=R.passed[T.id]?'已維持':(v>=other?'目前最高':'落後 '+fmt(other-v));
    h+='<div class="bcard'+(v>other?' lead':'')+(R.passed[T.id]?' folded':'')+'">'+
       '<div class="who" style="color:'+T.color+'">'+T.name+'</div>'+
       '<div class="amt" style="color:'+(v>=other?'var(--gold)':T.color)+'">'+fmt(v)+'</div>'+
       '<div class="st">'+st+'</div></div>';
  });
  $('board').innerHTML=h;
}
/* --- 輪流叫價 --- */
function nextTurn(){
  var m=R.bets.r,o=R.bets.b;
  if(m===o){
    if(!R.acted.b&&!R.passed.b) return oppTurn();
    if(!R.acted.r&&!R.passed.r) return myTurn();
    return finishBid();
  }
  var trail=m<o?'r':'b';
  if(trail==='r'){ if(R.passed.r) return finishBid(); return myTurn(); }
  if(R.passed.b) return finishBid();
  return oppTurn();
}
function raiseOpts(){
  var hi=Math.max(R.bets.r,R.bets.b),out=[];
  TIERS.forEach(function(v){ if(v>=hi+500||(v===hi&&R.bets.r<R.bets.b)) out.push(v); });
  return out.slice(0,2);
}
function myTurn(){
  R.acted.r=true; stage('輪到你叫價','加注或維持 · 8 秒沒動作視同維持',true);
  var box=$('bidActs'); box.innerHTML='';
  raiseOpts().forEach(function(v){
    var b=document.createElement('button'); b.className='btn gold';
    b.innerHTML=(v===R.bets.b?'跟到 ':'加到 ')+fmt(v)+'<small>'+(v===R.bets.b?'跟平 → 進搶答':'領先')+'</small>';
    b.addEventListener('click',function(){doRaise('r',v);}); box.appendChild(b);
  });
  var k=document.createElement('button'); k.className='btn ghost';
  k.innerHTML=(R.bets.r===R.bets.b?'維持<small>同注 → 進搶答</small>':'維持<small>放棄這題</small>');
  k.addEventListener('click',function(){doPass('r');}); box.appendChild(k);
  tone(660,.09); runT(8,function(){doPass('r',true);});
}
function oppTurn(){
  R.acted.b=true; stage('藍隊思考中','輪到出價較低的一方');
  $('bidActs').innerHTML=''; runT(8);
  setTimeout(function(){
    stopT(); setTm(0);
    var m=R.bets.r,o=R.bets.b,hi=Math.max(m,o);
    var willRaise = R.aiRaised<2 && hi<3000 && Math.random()<(m>o?.65:.45);
    if(willRaise){ var tgt=Math.min(3000,hi+ (Math.random()<.5?500:1000));
      R.aiRaised++; doRaise('b',tgt); } else doPass('b');
  },1400+Math.random()*900);
}
function doRaise(who,v){
  stopT(); $('bidActs').innerHTML=''; $('stage').classList.remove('turn');
  var other=who==='r'?R.bets.b:R.bets.r;
  R.bets[who]=v; R.acted[who]=true; R.acted[who==='r'?'b':'r']=false;
  addLog(who,(who==='r'?'紅隊':'藍隊')+(v===other?' 跟到 ':' 加到 ')+'<b>'+fmt(v)+'</b>');
  clink(); buzz([15,30,15]); paintBoard(); setTimeout(nextTurn,650);
}
function doPass(who,byTime){
  stopT(); $('bidActs').innerHTML=''; $('stage').classList.remove('turn');
  R.passed[who]=true; R.acted[who]=true;
  addLog(who,(who==='r'?'紅隊':'藍隊')+' 維持 '+fmt(R.bets[who])+(byTime?'（時間到）':''));
  tone(280,.12); paintBoard(); setTimeout(nextTurn,600);
}
function finishBid(){
  stopT(); setTm(0); $('bidActs').innerHTML=''; paintBoard();
  var m=R.bets.r,o=R.bets.b;
  if(m>o){ R.mode='A_me'; stage('收攤','紅隊獨得答題權'); tone(523,.12); setTimeout(function(){tone(784,.2);},110); }
  else if(m<o){ R.mode='A_opp'; stage('收攤','藍隊買下這題 · 你們轉為觀戰'); tone(240,.24,'sine',.05); }
  else { R.mode='B'; stage('收攤','雙方同注 → 搶答對決'); tone(370,.14,'triangle',.05);
         setTimeout(function(){tone(555,.24,'triangle',.05);},110); }
  buzz(25); setTimeout(phasePrep,1500);
}
/* --- 準備階段 --- */
function phasePrep(){
  var T=me(), can=T.hand && (T.hand.when==='prep') && (R.mode!=='A_opp') && !(T.hand.id==='bullet'&&R.mode==='B');
  if(!T.hand){ return phaseQuiz(); }
  stage('準備階段','下注結果已定 · 要不要出卡');
  var c=T.hand;
  $('handBox').innerHTML='<button class="icard '+c.r+'" id="useCard"'+(can?'':' disabled')+'>'+
    '<div class="rar">'+c.rar+'</div><div class="nm">'+c.n+'</div><div class="de">'+c.d+
    (can?'':'<br><b style="color:var(--red)">'+(R.mode==='A_opp'?'這回合不是你們答題':'搶答回合不能使用')+'</b>')+'</div></button>';
  show('blkPrep');
  if(can) $('useCard').addEventListener('click',function(){ useCard(c); });
  runT(15,function(){ phaseQuiz(); });
}
$('prepSkip').addEventListener('click',function(){ stopT(); phaseQuiz(); });
function useCard(c){
  stopT(); me().hand=null;
  if(c.r==='pr') prismFx(); else { clink(); buzz(20); }
  R.fx[c.id]=true;
  addLog('r','紅隊使用了 <b>'+c.n+'</b>');
  paintScores();
  setTimeout(phaseQuiz, c.r==='pr'?1500:600);
}
/* --- 作答 --- */
function phaseQuiz(){
  stopT();
  var q=R.q;
  $('catSub').textContent=DIFLB[q.difficulty]+' · '+fmt(SCORE[q.difficulty])+' 分';
  $('qText').textContent=q.question;
  var h='';
  q.options.forEach(function(o,i){ h+='<button class="opt" data-i="'+i+'"><span class="idx">'+
     'ABCD'[i]+'</span><span class="txt">'+o+'</span><span class="avs" id="av'+i+'"></span></button>'; });
  $('opts').innerHTML=h;
  Array.prototype.forEach.call($('opts').children,function(b){
    b.addEventListener('click',function(){ pickOpt(parseInt(b.dataset.i,10)); });
  });
  $('voteTxt').textContent='—'; $('oppTxt').textContent='';
  $('submit').classList.add('hide'); $('quizHint').textContent='';
  show('blkQuiz');

  if(R.mode==='A_opp'){ return spectate(); }
  var secs = R.mode==='B'? 30 : (R.fx.bullet?50:30);
  R.total=secs;
  stage(R.mode==='B'?'搶答對決':'作答中', R.mode==='B'?'比誰先送出':'全員選完就直接對答案');
  if(R.mode==='B'){ $('submit').classList.remove('hide'); $('quizHint').textContent='隊長按下送出就以當下最高票定案';
    var oppTime=4000+Math.random()*9000;
    R.oppTimer=setTimeout(function(){ if(!R.answered) oppSubmit(); },oppTime);
  } else { $('quizHint').textContent='全隊都選完會有 1.5 秒可以反悔'; }
  aiTeammates();
  ringRun(secs,function(){ if(!R.answered) resolve(true); });
  if(R.fx.pinoko) setTimeout(function(){ removeWrong(); },300);
}
function ringRun(sec,onEnd){
  var C=2*Math.PI*25, ring=$('ring'), tn=$('tn'), tw=$('timer');
  ring.setAttribute('stroke-dasharray',String(C)); ring.setAttribute('stroke','#22F5DC');
  tw.classList.remove('hot');
  stopT(); t=sec; tn.textContent=sec;
  timerId=setInterval(function(){
    t--; if(t<0)t=0; tn.textContent=t<10?('0'+t):t;
    ring.setAttribute('stroke-dashoffset',String(C*(1-t/sec)));
    if(t<=5){ tw.classList.add('hot'); ring.setAttribute('stroke','#FF3D63'); tone(1180,.05,'square',.028); }
    if(t<=0){ stopT(); onEnd&&onEnd(); }
  },1000);
}
function aiTeammates(){
  var q=R.q, acc=AI_ACC[q.difficulty];
  me().mem.forEach(function(m,i){
    if(m.me) return;
    setTimeout(function(){
      if(R.answered) return;
      var pick = Math.random()<acc? q.answer : wrongPick(q);
      m.vote=pick;
      var av=document.createElement('span'); av.className='av r'; av.textContent=m.name.slice(-1);
      var box=$('av'+pick); if(box) box.appendChild(av);
      tone(420+pick*90,.06); paintVotes();
    }, 1200+Math.random()*6000);
  });
}
function wrongPick(q){ var o=[0,1,2,3].filter(function(i){return i!==q.answer && R.removed.indexOf(i)<0;});
  return o[Math.floor(Math.random()*o.length)]; }
function pickOpt(i){
  if(R.answered||R.removed.indexOf(i)>=0) return;
  R.myVote=i;
  Array.prototype.forEach.call($('opts').children,function(x){x.classList.remove('sel');});
  $('opts').children[i].classList.add('sel');
  var old=document.querySelectorAll('.avs .av.cap'); Array.prototype.forEach.call(old,function(a){a.remove();});
  var av=document.createElement('span'); av.className='av r cap'; av.textContent=($('nick').value.trim()||'小酒').slice(0,1);
  $('av'+i).appendChild(av);
  tone(420+i*90,.07); buzz(10); paintVotes();
  if(R.mode!=='B') checkAllVoted();
}
function tally(){
  var w=[0,0,0,0];
  if(R.myVote>=0) w[R.myVote]+=1.5;
  me().mem.forEach(function(m){ if(!m.me&&m.vote>=0&&m.vote!=null) w[m.vote]+=1; });
  var best=-1,bv=0;
  for(var i=0;i<4;i++){ if(w[i]>bv){bv=w[i];best=i;} }
  return {w:w,best:best,total:bv};
}
function paintVotes(){
  var t2=tally(), s=[];
  for(var i=0;i<4;i++) if(t2.w[i]>0) s.push('ABCD'[i]+' '+t2.w[i]);
  $('voteTxt').textContent=s.join(' ／ ')||'—';
}
function checkAllVoted(){
  var all = R.myVote>=0 && me().mem.every(function(m){ return m.me || (m.vote!=null&&m.vote>=0); });
  if(!all) return;
  $('quizHint').textContent='即將送出 1.5 秒（改選可取消）';
  clearTimeout(R.soon);
  R.soon=setTimeout(function(){ if(!R.answered) resolve(false); },1500);
}
function removeWrong(){
  var q=R.q, cand=[0,1,2,3].filter(function(i){return i!==q.answer;});
  var kill=cand[Math.floor(Math.random()*cand.length)];
  R.removed.push(kill);
  $('opts').children[kill].classList.add('gone');
  $('opts').children[kill].disabled=true;
  tone(300,.2,'sawtooth',.05);
}
$('submit').addEventListener('click',function(){
  if(R.answered) return;
  var t2=tally();
  if(t2.best<0){ $('quizHint').textContent='還沒有人選擇 · 送出鎖住'; tone(160,.14,'square',.04); return; }
  clearTimeout(R.oppTimer); R.submitted=true; tone(196,.26,'sine',.07); buzz(30); resolve(false);
});
function oppSubmit(){
  R.answered=true; stopT();
  var q=R.q, ok=Math.random()<AI_ACC[q.difficulty];
  var pick= ok? q.answer : wrongPick(q);
  R.oppVote=pick;
  if(ok){ score(opp(), SCORE[q.difficulty]); score(me(), -R.bets.r, true); opp().correct++;
    finishQuiz('藍隊搶先送出，答對了 · 你們倒扣 '+fmt(R.bets.r),false,pick); }
  else { score(opp(), -R.bets.b);
    $('quizHint').textContent='藍隊搶答失敗！你們有 15 秒補救';
    tone(240,.2,'sine',.05); stage('補救機會','藍隊答錯 · 換你們作答');
    R.mode='A_me'; R.rescue=true; ringRun(15,function(){ if(!R.answered) resolve(true); });
    $('opts').children[pick].classList.add('no');
    R.removed.push(pick); }
}
function spectate(){
  stage('觀戰中','藍隊作答 · 你只能看');
  Array.prototype.forEach.call($('opts').children,function(b){ b.disabled=true; b.style.opacity=.55; });
  $('quizHint').textContent='沒有答題權的隊伍只能看對手作答';
  var q=R.q, ok=Math.random()<AI_ACC[q.difficulty];
  var pick= ok? q.answer : wrongPick(q);
  ringRun(8,function(){
    R.oppVote=pick;
    if(ok){ score(opp(),SCORE[q.difficulty]); opp().correct++; finishQuiz('藍隊答對了，拿走 '+fmt(SCORE[q.difficulty])+' 分',false,pick); }
    else { score(opp(),-R.bets.b); finishQuiz('藍隊答錯，倒扣他們押的 '+fmt(R.bets.b),false,pick); }
  });
}
function resolve(byTime){
  if(R.answered) return; R.answered=true; stopT(); clearTimeout(R.oppTimer); clearTimeout(R.soon);
  var q=R.q, t2=tally(), ans=t2.best;
  var ok = R.fx.lucky ? true : (ans===q.answer);
  var gain=SCORE[q.difficulty];
  if(R.fx.double) gain*=2;
  if(R.fx.lucky) gain=Math.round(gain*.2);
  if(ans<0&&!R.fx.lucky){ ok=false; }
  if(ok){ score(me(),gain); me().correct++;
    if(R.mode==='B'&&R.submitted){ score(opp(),-R.bets.b,true); }
  } else {
    var loss=R.bets.r;
    if(R.fx.immortal) loss=0; else if(R.fx.discount) loss=Math.round(loss/2);
    score(me(),-loss);
  }
  var msg = ok ? (R.mode==='B'?'搶答成功！':(R.rescue?'補救成功！':'答對了！')) :
    (ans<0?'沒有人作答 · 判定錯誤':'答錯了');
  finishQuiz(msg, ok, ans>=0?ans:-1, true);
}
function score(T,v,silent){ T.score+=v; if(!silent){} }
function finishQuiz(msg,ok,pick,mine){
  R.answered=true; stopT();
  var q=R.q;
  Array.prototype.forEach.call($('opts').children,function(b){b.disabled=true;});
  $('opts').children[q.answer].classList.add('ok');
  if(pick>=0&&pick!==q.answer){ $('opts').children[pick].classList.add('no','shake'); }
  flash(ok);
  if(mine){
    var g=ok? (R.fx.lucky?Math.round(SCORE[q.difficulty]*.2):(R.fx.double?SCORE[q.difficulty]*2:SCORE[q.difficulty]))
            : -(R.fx.immortal?0:(R.fx.discount?Math.round(R.bets.r/2):R.bets.r));
    delta((g>=0?'+':'−')+fmt(Math.abs(g)), ok?'var(--green)':'var(--red)');
    if(ok){tone(523,.12);setTimeout(function(){tone(659,.12);},90);setTimeout(function(){tone(784,.22);},180);buzz([20,40,20]);}
    else {tone(220,.18,'sawtooth',.05);setTimeout(function(){tone(150,.3,'sawtooth',.05);},110);buzz(60);}
  }
  paintScores();
  var box=$('resultBox');
  box.innerHTML='<div class="center" style="font-family:var(--disp);font-size:21px;font-weight:700;line-height:1.35;text-wrap:balance;color:'+(ok?'var(--green)':'var(--red)')+'">'+msg+'</div>'+
    '<div class="center" style="font-size:13px;color:var(--dim);margin-top:2px">正解：'+q.options[q.answer]+'</div>'+
    '<div class="expl">'+q.explain+'</div>';
  show('blkQuiz','blkResult');
  stage('本題結束','正解已標示在選項上');
  $('tm').textContent='—';$('tm').classList.remove('hot');
  $('tn').textContent='—';$('timer').classList.remove('hot');
  $('ring').setAttribute('stroke','#1a1f36');$('ring').setAttribute('stroke-dashoffset','0');
  $('quizHint').textContent='';
  var drew = mine && ok;
  if(drew) doWheel(); else $('wheelBox').classList.add('hide');
}
/* --- 抽卡 --- */
function doWheel(){
  var T=me();
  if(T.hand){ $('wheelBox').classList.add('hide'); return; }
  $('wheelBox').classList.remove('hide');
  var hit=Math.random()<0.2;
  var avail=CARDS.filter(function(c){return !G.cardsOut[c.id];});
  if(!avail.length) hit=false;
  var deg=360*4 + (hit? (110+Math.random()*30) : (200+Math.random()*80));
  var w=$('wheel'); w.style.transform='rotate(0deg)';
  setTimeout(function(){ w.style.transform='rotate('+deg+'deg)'; },50);
  tone(880,.05,'square',.03);
  var tick=setInterval(function(){tone(1200,.03,'square',.02);},140);
  setTimeout(function(){
    clearInterval(tick);
    if(hit){ var c=avail[Math.floor(Math.random()*avail.length)];
      G.cardsOut[c.id]=1; T.hand=c;
      if(c.r==='pr') prismFx(); else { clink(); buzz([20,30]); }
      $('wheelHint').innerHTML='抽到了 <b style="color:var(--gold)">'+c.n+'</b> · '+c.d;
      paintScores();
    } else { $('wheelHint').textContent='可惜，這次是空獎'; tone(260,.2); }
  },1900);
}
$('next').addEventListener('click',function(){ G.round++; startRound(); });

/* ---------- 結束 ---------- */
function endGame(){
  $('scr-game').classList.add('hide'); $('scr-end').classList.remove('hide');
  var ts=G.teams.slice().sort(function(a,b){return b.score-a.score;});
  var h='';
  ts.forEach(function(T,i){
    h+='<div class="lrow"'+(i===0?' style="border-color:'+T.color+'"':'')+'><span class="pos">'+(i+1)+'</span>'+
       '<span style="color:'+T.color+'">'+T.name+(T.me?'（你）':'')+'</span>'+
       '<span class="mini">答對 '+T.correct+'/'+G.max+'</span>'+
       '<span class="sc'+(T.score<0?' neg':'')+'">'+fmt(T.score)+'</span></div>';
  });
  $('endBox').innerHTML=h;
  var win=ts[0], diff=ts[0].score-ts[1].score;
  $('statBox').innerHTML='<div class="center big" style="color:'+win.color+'">'+win.name+' 獲勝</div>'+
    '<div class="center" style="font-size:13px;color:var(--dim)">分差 '+fmt(diff)+' 分 · 共 '+G.max+' 回合</div>'+
    '<div class="expl">起始 10,000 分。你的最終分數 '+fmt(me().score)+'，答對 '+me().correct+' 題。</div>';
  tone(523,.14); setTimeout(function(){tone(659,.14);},130); setTimeout(function(){tone(784,.3);},260);
}
$('again').addEventListener('click',function(){
  $('scr-end').classList.add('hide'); $('scr-start').classList.remove('hide');
});
$('go').addEventListener('click',function(){
  newGame(); $('scr-start').classList.add('hide'); $('scr-game').classList.remove('hide');
  tone(660,.1); startRound();
});
})();
</script>
