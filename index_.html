<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>誰是知識王</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root{
    --void:#04050A;--hair:#ffffff14;--hair2:#ffffff26;--ink:#EAEEF8;--dim:#8992A8;--dim2:#5A6178;
    --cy:#22F5DC;--vi:#B84DFF;--red:#FF3D63;--blue:#3B9CFF;--gold:#FFC93B;--green:#2FE39B;--silver:#CBD5E6;
    --disp:"Rajdhani","Noto Sans TC",system-ui,sans-serif;--body:"Noto Sans TC",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--void);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
    min-height:100vh;display:flex;justify-content:center;-webkit-text-size-adjust:100%}
  .amb{position:fixed;inset:0;z-index:0;pointer-events:none;background:
    radial-gradient(880px 600px at 16% 6%,#123c33 0%,transparent 62%),
    radial-gradient(820px 600px at 86% 20%,#2b1240 0%,transparent 64%),
    radial-gradient(700px 700px at 50% 110%,#191033 0%,transparent 60%),var(--void)}
  .amb:after{content:"";position:absolute;inset:0;background-image:
    linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);
    background-size:34px 34px;mask-image:radial-gradient(70% 60% at 50% 40%,#000 0%,transparent 78%)}
  .scan{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:repeating-linear-gradient(#ffffff08 0 1px,transparent 1px 3px);opacity:.4;mix-blend-mode:overlay}
  .app{position:relative;z-index:1;width:100%;max-width:430px;padding:16px 14px 26px;display:flex;flex-direction:column;gap:10px}

  h1{font-family:var(--disp);font-size:38px;font-weight:700;text-align:center;margin:22px 0 2px}
  h1 b{color:var(--cy);text-shadow:0 0 26px #22f5dc55}
  .sub{text-align:center;color:var(--dim);font-size:13px;margin:0 0 14px}
  .card{border:1px solid var(--hair);border-radius:14px;padding:13px 15px;background:linear-gradient(#0E1120,#0A0C16);
    box-shadow:inset 0 1px 0 #ffffff0d}
  .row{display:flex;gap:8px}.row>*{flex:1}
  label{font-family:var(--mono);font-size:10px;color:var(--dim2);letter-spacing:.1em;display:block;margin-bottom:5px}
  input{width:100%;font-family:var(--body);font-size:16px;color:var(--ink);background:#0a0c16;
    border:1px solid var(--hair);border-radius:10px;padding:11px 13px}
  input:focus{outline:none;border-color:#1c4a48}
  input.code{font-family:var(--mono);font-size:22px;letter-spacing:.3em;text-align:center}
  select{width:100%;font-family:var(--body);font-size:15px;color:var(--ink);background:#0a0c16;
    border:1px solid var(--hair);border-radius:10px;padding:11px}
  .btn{border:1px solid #22F5DC55;border-radius:12px;padding:13px;cursor:pointer;font-family:var(--disp);
    font-size:17px;font-weight:700;color:#B9FFF5;background:linear-gradient(#0b2e2c,#071c1d);width:100%;
    box-shadow:0 0 26px -12px var(--cy),inset 0 1px 0 #ffffff20;transition:transform .12s}
  .btn small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:#68B8B0;font-weight:400;margin-top:2px}
  .btn.gold{border-color:#FFC93B66;color:#FFE6A6;background:linear-gradient(#3a2b08,#241905);box-shadow:0 0 26px -12px var(--gold)}
  .btn.gold small{color:#C9A961}
  .btn.ghost{border-color:var(--hair2);background:#141830;color:var(--dim);box-shadow:none}
  .btn.vio{border-color:#7B2FB566;color:#F0D2FF;background:linear-gradient(#2a1040,#180a26)}
  .btn:disabled{opacity:.35;cursor:default;box-shadow:none}
  @media(prefers-reduced-motion:no-preference){.btn:active{transform:scale(.985)}}

  .hud{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .pill{font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--hair);
    background:#0c0f1c;border-radius:20px;padding:4px 9px;white-space:nowrap}
  .pill b{color:var(--ink)}
  .hexbadge{display:flex;align-items:center;gap:7px}
  .hex{width:26px;height:29px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
    background:linear-gradient(#1d2340,#101426);display:grid;place-items:center;font-size:12px}
  .hexbadge .t{font-family:var(--disp);font-size:15px;font-weight:600;line-height:1}
  .hexbadge .s{font-family:var(--mono);font-size:9px;color:var(--dim2)}

  .srow{display:flex;align-items:center;gap:8px;font-size:12.5px;position:relative;margin:4px 0}
  .srow.me:before{content:"";position:absolute;left:-13px;top:1px;bottom:1px;width:2px;border-radius:2px;
    background:var(--cy);box-shadow:0 0 10px var(--cy)}
  .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .srow .val{margin-left:auto;font-family:var(--disp);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
  .neg{color:var(--red)}
  .mini{font-family:var(--mono);font-size:9px;color:var(--dim2);border:1px solid var(--hair);border-radius:4px;padding:0 5px}

  .stage{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--hair);
    border-radius:11px;padding:8px 12px;background:#0b0e19}
  .stage.turn{border-color:#FFC93B66;background:linear-gradient(#241a05,#12100a);box-shadow:0 0 22px -12px var(--gold)}
  .stage .lb{font-family:var(--disp);font-size:14.5px;font-weight:600}
  .stage.turn .lb{color:var(--gold)}
  .stage .sb{font-family:var(--mono);font-size:9px;color:var(--dim2);display:block;font-weight:400}
  .stage .tm{font-family:var(--disp);font-size:22px;font-weight:700;color:var(--cy);font-variant-numeric:tabular-nums}
  .stage .tm.hot{color:var(--red)}

  .chipwrap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .chip{position:relative;width:100%;aspect-ratio:1;border-radius:50%;cursor:pointer;border:3px dashed #ffffff2e;
    background:radial-gradient(circle at 50% 38%,#1d2338,#0e1221 72%);display:grid;place-items:center;
    font-family:var(--disp);font-size:15px;font-weight:700;color:#9AA5BC;transition:transform .14s,box-shadow .2s,border-color .2s}
  .chip:after{content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid #ffffff12}
  .chip.t1{border-color:#CBD5E655;color:var(--silver)}.chip.t2{border-color:#8FC0FF55;color:#8FC0FF}
  .chip.t3{border-color:#3B9CFF66;color:var(--blue)}.chip.t4{border-color:#2FE39B66;color:var(--green)}
  .chip.t5{border-color:#E0C24A77;color:#E0C24A}
  .chip.t6{border-color:#FFC93B99;color:var(--gold);background:radial-gradient(circle at 50% 38%,#2a2008,#150f03 72%)}
  .chip.sel{transform:translateY(-6px) scale(1.04);box-shadow:0 12px 26px -10px #000,0 0 0 2px #22f5dc66,0 0 24px -6px var(--cy)}
  .chip:disabled{cursor:default;opacity:.35}

  .board{display:flex;gap:8px}
  .bcard{flex:1;border:1px solid var(--hair);border-radius:11px;padding:8px 10px;text-align:center;background:#0b0e19}
  .bcard .who{font-family:var(--mono);font-size:9px;letter-spacing:.1em}
  .bcard .amt{font-family:var(--disp);font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
  .bcard .st{font-family:var(--mono);font-size:8.5px;color:var(--dim2)}
  .bcard.lead{border-color:#FFC93B66;box-shadow:0 0 20px -12px var(--gold)}
  .bcard.folded{opacity:.42}
  .log{border-top:1px dashed #ffffff12;border-bottom:1px dashed #ffffff12;padding:6px 2px;min-height:40px;
    display:flex;flex-direction:column;gap:2px}
  .log .l{font-family:var(--mono);font-size:9.5px;color:var(--dim2)}
  .log .l b{color:var(--ink)}.log .l.r{color:#FFD98A}.log .l.b{color:#A9D6FF}

  .timer{position:relative;width:60px;height:60px;flex:none}
  .timer svg{transform:rotate(-90deg);display:block}
  .timer .tn{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-size:22px;
    font-weight:700;color:var(--cy);font-variant-numeric:tabular-nums}
  .timer.hot .tn{color:var(--red)}
  .qzone{display:flex;gap:12px;align-items:flex-start}
  .q{font-size:15.5px;line-height:1.5;font-weight:500;padding-top:2px}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{position:relative;display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;width:100%;
    border:1px solid var(--hair);background:linear-gradient(#0f1322,#0b0e19);color:var(--ink);
    font-family:var(--body);font-size:14px;text-align:left;
    clip-path:polygon(0 0,calc(100% - 13px) 0,100% 13px,100% 100%,13px 100%,0 calc(100% - 13px));
    transition:transform .12s,background .18s,border-color .18s}
  .opt .idx{font-family:var(--disp);font-size:13px;font-weight:700;color:var(--dim2);width:14px;flex:none}
  .opt .txt{flex:1}.opt .avs{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
  .opt.sel{border-color:#22f5dc80;background:linear-gradient(#0c2b2c,#0a1c22);box-shadow:0 0 22px -10px var(--cy)}
  .opt.sel .idx{color:var(--cy)}
  .opt.ok{border-color:#2fe39b90;background:linear-gradient(#0a2a20,#081a16)}.opt.ok .idx{color:var(--green)}
  .opt.no{border-color:#ff3d6390;background:linear-gradient(#2a0d16,#190810)}.opt.no .idx{color:var(--red)}
  .opt:disabled{cursor:default}
  @media(prefers-reduced-motion:no-preference){.opt:active{transform:scale(.985)}}
  .av{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);
    font-size:11px;font-weight:700;color:#05060c}
  .av.r{background:var(--red)}.av.b{background:var(--blue)}
  .av.cap{box-shadow:0 0 0 2px #080a12,0 0 0 3.5px var(--cy)}
  .av.off{opacity:.35}
  .votes{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:10px;
    color:var(--dim2);border-top:1px dashed #ffffff12;border-bottom:1px dashed #ffffff12;padding:7px 2px}
  .votes b{color:var(--cy)}
  .center{text-align:center}
  .big{font-family:var(--disp);font-size:26px;font-weight:700;line-height:1.35;text-wrap:balance}
  .expl{font-size:12.5px;color:var(--dim);line-height:1.6;border-top:1px dashed #ffffff12;padding-top:8px;margin-top:6px}
  .hint{font-family:var(--mono);font-size:9px;color:var(--dim2);text-align:center;line-height:1.6}
  .hide{display:none!important}
  .team{border:1px solid var(--hair);border-left:3px solid var(--red);border-radius:11px;padding:10px 12px;background:#0a0c16}
  .team.b{border-left-color:var(--blue)}
  .team h4{margin:0 0 7px;font-family:var(--disp);font-size:14px;font-weight:700;display:flex;justify-content:space-between}
  .mem{display:flex;gap:5px;flex-wrap:wrap}
  .status{position:fixed;left:0;right:0;top:0;z-index:40;text-align:center;font-family:var(--mono);font-size:10px;
    padding:5px;background:#2a0d16ee;color:#FF8FA3;border-bottom:1px solid #5c1d2b}
  .mute{position:fixed;right:10px;top:10px;z-index:45;width:30px;height:30px;border-radius:9px;
    border:1px solid var(--hair);background:#0c0f1cdd;color:var(--dim);cursor:pointer;font-size:13px}
  .flash{position:fixed;inset:0;z-index:35;pointer-events:none;opacity:0}
  .flash.ok{background:radial-gradient(60% 40% at 50% 46%,#2fe39b3d,transparent 72%)}
  .flash.no{background:radial-gradient(60% 40% at 50% 46%,#ff3d633d,transparent 72%)}
  .flash.show{animation:fl .9s ease-out}
  @keyframes fl{0%{opacity:1}100%{opacity:0}}
  .lrow{display:flex;align-items:center;gap:8px;border:1px solid var(--hair);border-radius:10px;padding:9px 11px;
    background:#0a0c16;font-size:13px;margin-bottom:7px}
  .lrow .pos{font-family:var(--disp);font-size:15px;color:var(--dim2);width:18px;font-weight:700}
  .lrow .sc{margin-left:auto;font-family:var(--disp);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
  .share{font-family:var(--mono);font-size:11px;color:var(--cy);word-break:break-all;background:#0a1c1e;
    border:1px solid #1c4a48;border-radius:9px;padding:9px 11px}
</style>
</head>
<body>
<div class="amb"></div><div class="scan"></div>
<div class="flash ok" id="flashOk"></div><div class="flash no" id="flashNo"></div>
<div id="netbar" class="status hide">連線中…</div>
<button class="mute" id="mute" aria-label="音效">🔊</button>

<div class="app">
  <!-- 進入 -->
  <section id="s-start">
    <h1>誰是<b>知識王</b></h1>
    <p class="sub">分隊搶答，但分數是籌碼</p>
    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <div><label>你的暱稱</label><input id="nick" maxlength="8" placeholder="輸入暱稱"></div>
      <div><label>房號（加入別人的房間才要填）</label><input id="code" class="code" inputmode="numeric" maxlength="6" placeholder="－－－－－－"></div>
      <button class="btn" id="join">加入房間</button>
      <button class="btn ghost" id="joinSpec">以觀戰身分加入<small>只看不玩</small></button>
      <button class="btn ghost" id="create">建立新房間<small>你會成為房主</small></button>
      <div id="startMsg" class="hint" style="min-height:14px"></div>
    </div>
    <p class="hint" style="margin-top:14px">題庫 <b id="qc"></b> 題 · 七領域四難度<br>不用註冊，點連結就能玩</p>
  </section>

  <!-- 大廳 -->
  <section id="s-lobby" class="hide">
    <h1 style="font-size:26px;margin:16px 0 2px">大廳</h1>
    <p class="sub">房號 <b id="lbCode" style="color:var(--cy);font-family:var(--mono);letter-spacing:.2em"></b></p>
    <div class="share" id="shareBox">—</div>
    <button class="btn ghost" id="copyLink" style="margin-top:8px">複製邀請連結</button>
    <div id="teams" style="display:flex;flex-direction:column;gap:9px;margin-top:12px"></div>
    <div id="waitBox" class="card hide" style="margin-top:9px"></div>
    <div id="specBox" class="card hide" style="margin-top:9px"></div>
    <button class="btn ghost" id="toggleSpec" style="margin-top:9px">—</button>
    <div class="card hide" id="hostBox" style="margin-top:10px;display:flex;flex-direction:column;gap:10px">
      <div class="row">
        <div><label>回合數</label><select id="rounds"><option value="6">6 回合</option><option value="12" selected>12 回合</option></select></div>
        <div><label>隊伍</label><select id="tcount"><option value="2" selected>2 隊</option></select></div>
      </div>
      <button class="btn ghost" id="shuffle">重新分隊</button>
      <button class="btn" id="start">開始遊戲<small>每隊至少 1 人</small></button>
    </div>
    <p class="hint" id="lobbyHint" style="margin-top:12px">等房主開始遊戲…</p>
  </section>

  <!-- 遊戲 -->
  <section id="s-game" class="hide">
    <div class="hud">
      <span class="pill">回合 <b id="rnd">1</b>/<b id="rndMax">12</b></span>
      <div class="hexbadge"><span class="hex" id="catIcon">?</span>
        <div><div class="t" id="catName">—</div><div class="s" id="catSub">—</div></div></div>
    </div>
    <div class="card" id="scoreBox"></div>
    <div class="stage" id="stage"><div><span class="lb" id="stLb">—</span><span class="sb" id="stSb"></span></div>
      <span class="tm" id="tm">—</span></div>

    <div id="blkBet" class="hide" style="display:flex;flex-direction:column;gap:10px">
      <div class="chipwrap" id="chips"></div>
      <button class="btn" id="betOk">確認下注<small>隊長專屬</small></button>
      <div class="hint" id="betHint"></div>
    </div>

    <div id="blkBid" class="hide" style="display:flex;flex-direction:column;gap:10px">
      <div class="board" id="board"></div>
      <div class="log" id="log"></div>
      <div id="bidActs" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>

    <div id="blkQuiz" class="hide" style="display:flex;flex-direction:column;gap:10px">
      <div class="qzone"><div class="timer" id="timer">
        <svg width="60" height="60" viewBox="0 0 60 60"><circle cx="30" cy="30" r="25" fill="none" stroke="#1a1f36" stroke-width="4"></circle>
        <circle id="ring" cx="30" cy="30" r="25" fill="none" stroke="#22F5DC" stroke-width="4" stroke-linecap="round"
          stroke-dasharray="157" stroke-dashoffset="0"></circle></svg><div class="tn" id="tn">—</div></div>
        <div class="q" id="qText">—</div></div>
      <div class="opts" id="opts"></div>
      <div class="votes"><span>本隊 <b id="voteTxt">—</b></span><span id="oppTxt"></span></div>
      <button class="btn gold hide" id="submit">送出答案<small>隊長專屬 · 即刻以最高票定案</small></button>
      <div class="hint" id="quizHint"></div>
    </div>

    <div id="blkResult" class="hide" style="display:flex;flex-direction:column;gap:10px">
      <div class="card" id="resultBox"></div>
      <button class="btn hide" id="next">下一回合</button>
      <div class="hint" id="resHint"></div>
    </div>
  </section>

  <!-- 結算 -->
  <section id="s-end" class="hide">
    <h1 style="font-size:28px">最終<b>結算</b></h1>
    <div id="endBox"></div>
    <div class="card" id="endStat" style="margin-top:8px"></div>
    <button class="btn hide" id="again" style="margin-top:12px">再來一局</button>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

"}, {"id": "mat-e-003", "category": "數學", "difficulty": "easy", "question": "三角形的內角和是幾度？", "options": ["90 度", "180 度", "270 度", "360 度"], "answer": 1, "explain": "平面三角形內角和固定為 180 度。"}, {"id": "mat-e-004", "category": "數學", "difficulty": "easy", "question": "二分之一加四分之一等於多少？", "options": ["三分之一", "四分之三", "三分之二", "六分之一"], "answer": 1, "explain": "1/2 + 1/4 = 2/4 + 1/4 = 3/4。"}, {"id": "mat-e-005", "category": "數學", "difficulty": "easy", "question": "100 的 20% 是多少？", "options": ["2", "20", "200", "0.2"], "answer": 1, "explain": "100 × 0.2 = 20。"}, {"id": "mat-e-006", "category": "數學", "difficulty": "easy", "question": "最小的質數是哪一個？", "options": ["0", "1", "2", "3"], "answer": 2, "explain": "2 是最小的質數，也是唯一的偶質數；1 不是質數。"}, {"id": "mat-e-007", "category": "數學", "difficulty": "easy", "question": "一打（dozen）是幾個？", "options": ["10 個", "12 個", "16 個", "20 個"], "answer": 1, "explain": "一打等於 12 個。"}, {"id": "mat-e-008", "category": "數學", "difficulty": "easy", "question": "7 × 8 等於多少？", "options": ["48", "54", "56", "64"], "answer": 2, "explain": "7×8 = 56。"}, {"id": "mat-e-009", "category": "數學", "difficulty": "easy", "question": "圓周率取到小數點後兩位是多少？", "options": ["3.12", "3.14", "3.16", "3.18"], "answer": 1, "explain": "π ≈ 3.14159…，取兩位小數為 3.14。"}, {"id": "mat-e-010", "category": "數學", "difficulty": "easy", "question": "0 除以 5 等於多少？", "options": ["0", "1", "5", "無意義"], "answer": 0, "explain": "0 除以任何非零數都等於 0；但除以 0 才是沒有定義。"}, {"id": "mat-e-011", "category": "數學", "difficulty": "easy", "question": "一個正六邊形有幾條邊？", "options": ["5 條", "6 條", "7 條", "8 條"], "answer": 1, "explain": "正六邊形有 6 條邊、6 個頂點。"}, {"id": "mat-n-002", "category": "數學", "difficulty": "normal", "question": "2 的 5 次方等於多少？", "options": ["16", "25", "32", "64"], "answer": 2, "explain": "2⁵ = 2×2×2×2×2 = 32。"}, {"id": "mat-n-003", "category": "數學", "difficulty": "normal", "question": "某數的 25% 是 15，這個數是多少？", "options": ["45", "50", "60", "75"], "answer": 2, "explain": "15 ÷ 0.25 = 60。"}, {"id": "mat-n-004", "category": "數學", "difficulty": "normal", "question": "3、7、8、10、12 這五個數的平均是多少？", "options": ["7", "8", "9", "10"], "answer": 1, "explain": "總和 40 ÷ 5 = 8。"}, {"id": "mat-n-005", "category": "數學", "difficulty": "normal", "question": "一件衣服打八折後是 640 元，原價多少？", "options": ["720 元", "760 元", "800 元", "840 元"], "answer": 2, "explain": "640 ÷ 0.8 = 800 元。"}, {"id": "mat-n-006", "category": "數學", "difficulty": "normal", "question": "5 的階乘（5!）等於多少？", "options": ["60", "100", "120", "240"], "answer": 2, "explain": "5! = 5×4×3×2×1 = 120。"}, {"id": "mat-n-007", "category": "數學", "difficulty": "normal", "question": "半徑為 3 的圓，面積是多少？", "options": ["6π", "9π", "12π", "18π"], "answer": 1, "explain": "圓面積 = πr² = π×3² = 9π。"}, {"id": "mat-n-008", "category": "數學", "difficulty": "normal", "question": "1 公里等於幾公分？", "options": ["1,000 公分", "10,000 公分", "100,000 公分", "1,000,000 公分"], "answer": 2, "explain": "1 公里 = 1,000 公尺 = 100,000 公分。"}, {"id": "mat-n-009", "category": "數學", "difficulty": "normal", "question": "1 加到 10 的總和是多少？", "options": ["45", "50", "55", "60"], "answer": 2, "explain": "(1+10)×10÷2 = 55。"}, {"id": "mat-n-010", "category": "數學", "difficulty": "normal", "question": "直角三角形中，斜邊平方等於兩股平方和，這是什麼定理？", "options": ["歐拉定理", "畢氏定理", "餘弦定理", "海龍公式"], "answer": 1, "explain": "畢氏定理（勾股定理）：a² + b² = c²。"}, {"id": "mat-n-011", "category": "數學", "difficulty": "normal", "question": "一個立方體有幾個面？", "options": ["4 個", "6 個", "8 個", "12 個"], "answer": 1, "explain": "立方體有 6 個面、8 個頂點、12 條稜。"}, {"id": "mat-h-002", "category": "數學", "difficulty": "hard", "question": "1 加到 100 的總和是多少？", "options": ["4,950", "5,050", "5,500", "10,100"], "answer": 1, "explain": "(1+100)×100÷2 = 5,050。"}, {"id": "mat-h-003", "category": "數學", "difficulty": "hard", "question": "擲兩顆公正骰子，點數和為 7 的機率是多少？", "options": ["1/6", "1/8", "1/9", "1/12"], "answer": 0, "explain": "36 種等可能結果中有 6 種和為 7，機率 6/36 = 1/6，是所有點數和裡機率最高的。"}, {"id": "mat-h-004", "category": "數學", "difficulty": "hard", "question": "log₁₀ 1000 等於多少？", "options": ["2", "3", "10", "100"], "answer": 1, "explain": "10³ = 1000，所以 log₁₀1000 = 3。"}, {"id": "mat-h-005", "category": "數學", "difficulty": "hard", "question": "方程式 x² − 5x + 6 = 0 的兩根之和是多少？", "options": ["−5", "5", "6", "1"], "answer": 1, "explain": "根與係數關係：兩根和 = −b/a = 5（兩根為 2 與 3）。"}, {"id": "mat-h-006", "category": "數學", "difficulty": "hard", "question": "半徑為 6 的球，體積是多少？", "options": ["144π", "216π", "288π", "432π"], "answer": 2, "explain": "V = 4/3 πr³ = 4/3 × π × 216 = 288π。"}, {"id": "mat-h-007", "category": "數學", "difficulty": "hard", "question": "60 與 84 的最大公因數是多少？", "options": ["6", "12", "15", "24"], "answer": 1, "explain": "60 = 2²×3×5，84 = 2²×3×7，公因數取 2²×3 = 12。"}, {"id": "mat-h-008", "category": "數學", "difficulty": "hard", "question": "等比數列 2, 6, 18, … 的第 5 項是多少？", "options": ["54", "108", "162", "243"], "answer": 2, "explain": "公比 3：2, 6, 18, 54, 162。"}, {"id": "mat-h-009", "category": "數學", "difficulty": "hard", "question": "sin 30° 等於多少？", "options": ["1/2", "√2/2", "√3/2", "1"], "answer": 0, "explain": "sin30° = 1/2；cos30° 才是 √3/2。"}, {"id": "mat-h-010", "category": "數學", "difficulty": "hard", "question": "一個正十邊形的內角和是多少度？", "options": ["1,260 度", "1,440 度", "1,620 度", "1,800 度"], "answer": 1, "explain": "(10−2)×180 = 1,440 度。"}, {"id": "mat-h-011", "category": "數學", "difficulty": "hard", "question": "連續丟 3 次公正硬幣，至少出現一次正面的機率是多少？", "options": ["1/2", "5/8", "3/4", "7/8"], "answer": 3, "explain": "用反面思考：三次全是反面的機率為 (1/2)³ = 1/8，所以至少一次正面 = 1 − 1/8 = 7/8。"}, {"id": "mat-x-002", "category": "數學", "difficulty": "hell", "question": "C(10,3) 等於多少？", "options": ["30", "60", "120", "720"], "answer": 2, "explain": "10!/(3!×7!) = (10×9×8)/(3×2×1) = 120。"}, {"id": "mat-x-003", "category": "數學", "difficulty": "hell", "question": "8 個人互相握手一次，總共會握幾次手？", "options": ["16 次", "28 次", "36 次", "64 次"], "answer": 1, "explain": "C(8,2) = 28 次。"}, {"id": "mat-x-004", "category": "數學", "difficulty": "hell", "question": "36 有幾個正因數？", "options": ["6 個", "8 個", "9 個", "12 個"], "answer": 2, "explain": "36 = 2²×3²，因數個數 = (2+1)(2+1) = 9 個。"}, {"id": "mat-x-005", "category": "數學", "difficulty": "hell", "question": "1 到 100 的整數中，同時是 3 與 5 的倍數的有幾個？", "options": ["3 個", "5 個", "6 個", "10 個"], "answer": 2, "explain": "即 15 的倍數：15、30、45、60、75、90 共 6 個。"}, {"id": "mat-x-006", "category": "數學", "difficulty": "hell", "question": "袋子裡有 3 顆紅球與 2 顆藍球，連續抽出兩顆且不放回，兩顆都是紅球的機率是多少？", "options": ["3/10", "2/5", "9/25", "1/2"], "answer": 0, "explain": "第一顆抽到紅球 3/5，第二顆剩 2 紅 2 藍為 2/4，相乘 = 6/20 = 3/10。若是抽完放回才會是 9/25。"}, {"id": "mat-x-007", "category": "數學", "difficulty": "hell", "question": "某商品先漲價 20%，之後再打八折，最後售價與原價相比是？", "options": ["正好等於原價", "比原價便宜 4%", "比原價貴 4%", "比原價便宜 20%"], "answer": 1, "explain": "1.2 × 0.8 = 0.96，等於原價的 96%，所以便宜了 4%。漲跌百分比不能直接相加減，這是最常見的陷阱。"}, {"id": "mat-x-008", "category": "數學", "difficulty": "hell", "question": "時鐘顯示 3 點 30 分時，時針與分針的夾角是幾度？", "options": ["60 度", "75 度", "90 度", "105 度"], "answer": 1, "explain": "分針在 180°；時針走到 3×30 + 30×0.5 = 105°，兩者相差 75°。關鍵是時針在半小時內也會移動 15°。"}, {"id": "mat-x-009", "category": "數學", "difficulty": "hell", "question": "三邊長為 3、4、5 的三角形面積是多少？", "options": ["6", "7.5", "10", "12"], "answer": 0, "explain": "這是直角三角形，面積 = 3×4÷2 = 6。"}, {"id": "mat-x-010", "category": "數學", "difficulty": "hell", "question": "半徑為 r 的圓，其內接正方形面積是多少？", "options": ["r²", "2r²", "πr²", "4r²"], "answer": 1, "explain": "正方形對角線等於直徑 2r，面積 = (2r)²/2 = 2r²。"}, {"id": "mat-x-011", "category": "數學", "difficulty": "hell", "question": "0.999…（無限循環）等於多少？", "options": ["略小於 1", "恰好等於 1", "略大於 1", "無法確定"], "answer": 1, "explain": "在實數系統中 0.999… 與 1 是同一個數，可用 1/3 = 0.333… 兩邊乘 3 驗證。"}, {"id": "his-e-002", "category": "歷史", "difficulty": "easy", "question": "第二次世界大戰結束於西元哪一年？", "options": ["1943 年", "1944 年", "1945 年", "1946 年"], "answer": 2, "explain": "1945 年德國五月投降、日本八月宣布投降，二戰全面結束。"}, {"id": "his-e-003", "category": "歷史", "difficulty": "easy", "question": "改良造紙術的蔡倫是哪個朝代的人？", "options": ["西漢", "東漢", "唐朝", "宋朝"], "answer": 1, "explain": "蔡倫於東漢時期改良造紙技術，史稱「蔡侯紙」。"}, {"id": "his-e-004" culty": "hell", "question": "巴西的首都是哪一個城市？", "options": ["里約熱內盧", "聖保羅", "巴西利亞", "薩爾瓦多"], "answer": 2, "explain": "1960 年遷都至內陸新建的巴西利亞；里約是舊首都。"}, {"id": "geo-x-004", "category": "地理", "difficulty": "hell", "question": "台灣本島的最北端地標是？", "options": ["富貴角", "三貂角", "野柳岬", "鼻頭角"], "answer": 0, "explain": "富貴角位於新北市石門區，是台灣本島最北端；三貂角是最東端。"}, {"id": "geo-x-005", "category": "地理", "difficulty": "hell", "question": "哪一個國家被稱為「千湖之國」？", "options": ["瑞典", "芬蘭", "加拿大", "俄羅斯"], "answer": 1, "explain": "芬蘭境內湖泊逾十八萬個，因此有千湖之國之稱。"}, {"id": "geo-x-006", "category": "地理", "difficulty": "hell", "question": "南美洲最南端的著名海角是？", "options": ["好望角", "合恩角", "羅卡角", "北角"], "answer": 1, "explain": "合恩角位於智利南端；好望角在南非。"}, {"id": "geo-x-007", "category": "地理", "difficulty": "hell", "question": "世界上最大的珊瑚礁群「大堡礁」位於哪一個國家外海？", "options": ["印尼", "菲律賓", "澳洲", "斐濟"], "answer": 2, "explain": "大堡礁位於澳洲東北外海，全長約 2,300 公里。"}, {"id": "geo-x-008", "category": "地理", "difficulty": "hell", "question": "分隔台灣本島與菲律賓的海峽是？", "options": ["巴士海峽", "台灣海峽", "麻六甲海峽", "呂宋海峽"], "answer": 0, "explain": "巴士海峽位於台灣與菲律賓呂宋島之間。"}, {"id": "geo-x-009", "category": "地理", "difficulty": "hell", "question": "世界上面積最大的湖泊（含鹹水湖）是？", "options": ["蘇必略湖", "裏海", "維多利亞湖", "貝加爾湖"], "answer": 1, "explain": "裏海面積約 37 萬平方公里，是世界最大的湖泊。"}, {"id": "geo-x-010", "category": "地理", "difficulty": "hell", "question": "瑞士的首都是哪一個城市？", "options": ["蘇黎世", "日內瓦", "伯恩", "巴塞爾"], "answer": 2, "explain": "伯恩是瑞士的聯邦城市（首都）；蘇黎世是最大城市、日內瓦是國際組織所在地。"}, {"id": "acg-e-002", "category": "動漫", "difficulty": "easy", "question": "《航海王》中，主角魯夫吃下的惡魔果實是哪一種？", "options": ["橡膠果實", "燒燒果實", "暗暗果實", "手術果實"], "answer": 0, "explain": "魯夫在東海誤食橡膠果實成為橡膠人；燒燒是艾斯、暗暗是黑鬍子、手術是羅。"}, {"id": "acg-e-003", "category": "動漫", "difficulty": "easy", "question": "《名偵探柯南》中，工藤新一身體變小後使用的化名是？", "options": ["江戶川柯南", "毛利小五郎", "黑羽快斗", "服部平次"], "answer": 0, "explain": "他取自愛倫坡與柯南・道爾，化名江戶川柯南。"}, {"id": "acg-e-004", "category": "動漫", "difficulty": "easy", "question": "《寶可夢》動畫中，小智最著名的夥伴寶可夢是？", "options": ["皮卡丘", "小火龍", "傑尼龜", "妙蛙種子"], "answer": 0, "explain": "皮卡丘從第一集起就是小智的固定夥伴。"}, {"id": "acg-e-005", "category": "動漫", "difficulty": "easy", "question": "《七龍珠》中，孫悟空的真實種族是？", "options": ["地球人", "賽亞人", "那美克星人", "魔族"], "answer": 1, "explain": "孫悟空本名卡卡羅特，是被送到地球的賽亞人。"}, {"id": "acg-e-006", "category": "動漫", "difficulty": "easy", "question": "《蠟筆小新》的主角野原新之助設定上幾歲？", "options": ["3 歲", "5 歲", "7 歲", "9 歲"], "answer": 1, "explain": "小新是 5 歲的幼稚園生，就讀雙葉幼稚園向日葵班。"}, {"id": "acg-e-007", "category": "動漫", "difficulty": "easy", "question": "《灌籃高手》中，櫻木花道就讀的高中是？", "options": ["湘北高中", "陵南高中", "海南大附屬", "翔陽高中"], "answer": 0, "explain": "櫻木加入湘北高中籃球隊，是全作的主軸。"}, {"id": "acg-e-008", "category": "動漫", "difficulty": "easy", "question": "《美少女戰士》中，主角月野兔變身後的名稱是？", "options": ["水手月亮", "水手水星", "水手火星", "水手金星"], "answer": 0, "explain": "月野兔變身為水手月亮（Sailor Moon）。"}, {"id": "acg-e-009", "category": "動漫", "difficulty": "easy", "question": "《鬼滅之刃》的主角名字是？", "options": ["竈門炭治郎", "我妻善逸", "嘴平伊之助", "富岡義勇"], "answer": 0, "explain": "主角為竈門炭治郎，為了讓妹妹禰豆子變回人類而戰。"}, {"id": "acg-e-010", "category": "動漫", "difficulty": "easy", "question": "《進擊的巨人》中，人類居住區最外圍的城牆名稱是？", "options": ["瑪利亞之牆", "羅塞之牆", "希娜之牆", "希爾維亞之牆"], "answer": 0, "explain": "由外而內依序為瑪利亞、羅塞、希娜三道城牆。"}, {"id": "acg-n-001", "category": "動漫", "difficulty": "normal", "question": "《航海王》中，魯夫所率領的海賊團名稱是？", "options": ["草帽海賊團", "紅髮海賊團", "白鬍子海賊團", "百獸海賊團"], "answer": 0, "explain": "因魯夫戴著紅髮傑克贈送的草帽而得名。"}, {"id": "acg-n-002", "category": "動漫", "difficulty": "normal", "question": "《火影忍者》中，封印在漩渦鳴人體內的尾獸是？", "options": ["一尾", "三尾", "七尾", "九尾"], "answer": 3, "explain": "九尾妖狐（九喇嘛）在鳴人出生當天被封入他體內。"}, {"id": "acg-n-003", "category": "動漫", "difficulty": "normal", "question": "《死神 BLEACH》中，黑崎一護的斬魄刀名稱是？", "options": ["斬月", "千本櫻", "流刃若火", "冰輪丸"], "answer": 0, "explain": "斬月是一護的斬魄刀；千本櫻是朽木白哉、流刃若火是山本總隊長。"}, {"id": "acg-n-004", "category": "動漫", "difficulty": "normal", "question": "《鬼滅之刃》中，炭治郎最初學會的呼吸法是？", "options": ["水之呼吸", "炎之呼吸", "雷之呼吸", "日之呼吸"], "answer": 0, "explain": "炭治郎師從鱗瀧左近次，最初習得水之呼吸。"}, {"id": "acg-n-005", "category":   var code=String(Math.floor(100000+Math.random()*900000));
  var r=db.ref('rooms/'+code);
  r.child('meta').once('value').then(function(s){
    if(s.exists()){ return $('create').click(); }
    var init={meta:{host:uid,phase:'lobby',round:0,max:12,createdAt:firebase.database.ServerValue.TIMESTAMP}};
    init['players']={};init.players[uid]={name:nm,team:'r',leader:true,online:true};
    init['teams']={r:{score:10000,correct:0},b:{score:10000,correct:0}};
    return r.set(init).then(function(){enter(code);});
  });
});
function doJoin(asSpec){
  var nm=nickOK();if(!nm)return;
  var code=$('code').value.replace(/\D/g,'');
  if(code.length!==6){smsg('房號要 6 位數字（連結會自動帶入）',true);return;}
  smsg('正在加入 '+code+' …');
  db.ref('rooms/'+code).once('value').then(function(s){
    var R=s.val();
    if(!R||!R.meta){smsg('找不到房號 '+code+'，請確認數字或請房主重發連結',true);return;}
    var started=(R.meta.phase!=='lobby'&&R.meta.phase!=='end');
    var mine=(R.players||{})[uid];
    var team;
    if(asSpec||started) team='spec';
    else team=(mine&&mine.team)?mine.team:smallerTeam(R.players);
    var u={name:nm,online:true,team:team};
    if(!mine||mine.leader==null)u.leader=false;
    db.ref('rooms/'+code+'/players/'+uid).update(u).then(function(){
      smsg('');enter(code);
      if(started&&!asSpec) net('遊戲已經開始，你以觀戰身分加入',false),setTimeout(function(){net('');},3500);
    }).catch(function(e){smsg('加入失敗：'+(e.code||e.message),true);});
  }).catch(function(e){smsg('讀取房間失敗：'+(e.code||e.message),true);});
}
$('join').addEventListener('click',function(){doJoin(false);});
$('joinSpec').addEventListener('click',function(){doJoin(true);});
function enter(code){
  room=code;ref=db.ref('rooms/'+code);
  history.replaceState(null,'',location.pathname+'?room='+code);
  ref.child('players/'+uid+'/online').onDisconnect().set(false);
  ref.on('value',function(s){S=s.val();if(S)render();});
  $('s-start').classList.add('hide');
  var url=location.origin+location.pathname+'?room='+code;
  $('shareBox').textContent=url;
  $('lbCode').textContent=code;
  tone(660,.1);
}
$('copyLink').addEventListener('click',function(){
  var t=$('shareBox').textContent;
  if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){$('copyLink').textContent='已複製 ✓';
    setTimeout(function(){$('copyLink').textContent='複製邀請連結';},1600);});}
  else{net('請長按上面的網址複製');setTimeout(function(){net('');},2200);}
});

/* ---- 工具 ---- */
function isHost(){return S&&S.meta&&S.meta.host===uid;}
function myP(){return S&&S.players&&S.players[uid];}
function myTeam(){var p=myP();return p?p.team:null;}
function amLeader(){var p=myP();return !!(p&&p.leader);}
function teamMembers(t){var o=[];if(!S.players)return o;
  for(var k in S.players){if(S.players[k].team===t)o.push({uid:k,p:S.players[k]});}
  o.sort(function(a,b){return a.uid<b.uid?-1:1;});return o;}
function teamOf(t){return (S.teams&&S.teams[t])||{score:0};}
function other(t){return t==='r'?'b':'r';}
function tally(t){
  var w=[0,0,0,0],votes=(S.votes||{});
  teamMembers(t).forEach(function(m){
    var v=votes[m.uid];if(v==null||v<0)return;w[v]+=m.p.leader?1.5:1;});
  var best=-1,bv=0;for(var i=0;i<4;i++){if(w[i]>bv){bv=w[i];best=i;}}
  return {w:w,best:best,any:bv>0};
}
function allVoted(t){var votes=S.votes||{};return teamMembers(t).every(function(m){
  return !m.p.online || (votes[m.uid]!=null&&votes[m.uid]>=0);});}

/* ---- 房主：推進 ---- */
function setPhase(ph,secs,extra){
  var u=extra||{};u['meta/phase']=ph;
  u['meta/endsAt']=secs?now()+secs*1000:null;
  ref.update(u);
}
function hostTick(){
  if(!isHost()||!S||!S.meta)return;
  var m=S.meta,ph=m.phase;
  if(ph==='lobby'||ph==='end')return;
  var left=m.endsAt?(m.endsAt-now()):999999;
  if(ph==='quiz'&&!m.endsAt)return;
  if(left>0){
    if(ph==='bid'&&m.turn==='b'&&!m.aiPending){} // 人類對戰，無 AI
    if(ph==='quiz'&&m.mode!=='B'&&allVoted(m.actor)&&!m.soon){
      ref.update({'meta/soon':true,'meta/endsAt':now()+1500});
    }
    return;
  }
  // 時間到
  if(ph==='reveal'){ return startBet(); }
  if(ph==='bet'){ return revealBets(); }
  if(ph==='bid'){ return bidTimeout(); }
  if(ph==='quiz'){ return judge(); }
  if(ph==='result'){ return; }
}
setInterval(function(){try{hostTick();}catch(e){}},400);

function startRound(){
  var m=S.meta,round=(m.round||0)+1;
  if(round>m.max){ return ref.update({'meta/phase':'end','meta/endsAt':null}); }
  var used=S.usedQ||{},pick=null,tries=0;
  while(tries<200){var q=QB[Math.floor(Math.random()*QB.length)];if(!used[q.id]){pick=q;break;}tries++;}
  if(!pick)pick=QB[Math.floor(Math.random()*QB.length)];
  var u={};
  u['meta/round']=round;u['meta/phase']='reveal';u['meta/endsAt']=now()+2000;
  u['meta/mode']=null;u['meta/actor']=null;u['meta/turn']=null;u['meta/soon']=null;u['meta/submit']=null;
  u['usedQ/'+pick.id]=true;
  u['q']={id:pick.id,category:pick.category,difficulty:pick.difficulty,question:pick.question,
          options:pick.options,answer:pick.answer,explain:pick.explain};
  u['votes']=null;u['result']=null;u['bidLog']=null;
  u['teams/r/bet']=0;u['teams/b/bet']=0;
  u['teams/r/passed']=false;u['teams/b/passed']=false;
  u['teams/r/acted']=false;u['teams/b/acted']=false;
  ref.update(u);
}
function startBet(){ setPhase('bet',10); }
function revealBets(){
  var r=teamOf('r').bet||0,b=teamOf('b').bet||0;
  var u={};
  if(!r){u['teams/r/bet']=500;r=500;} if(!b){u['teams/b/bet']=500;b=500;}
  u['meta/phase']='bid';u['meta/endsAt']=null;
  ref.update(u).then(function(){ setTimeout(nextBidTurn,1200); });
}
function nextBidTurn(){
  if(!isHost())return;
  var r=teamOf('r').bet||0,b=teamOf('b').bet||0,T=S.teams;
  var turn=null;
  if(r===b){
    if(!T.b.acted&&!T.b.passed)turn='b';
    else if(!T.r.acted&&!T.r.passed)turn='r';
  } else {
    var trail=r<b?'r':'b';
    if(!T[trail].passed)turn=trail;
  }
  if(!turn) return finishBid();
  ref.update({'meta/turn':turn,'meta/phase':'bid','meta/endsAt':now()+8000});
}
function bidTimeout(){
  var t=S.meta.turn;if(!t)return finishBid();
  pass(t,true);
}
function raise(t,v){
  var u={};u['teams/'+t+'/bet']=v;u['teams/'+t+'/acted']=true;u['teams/'+other(t)+'/acted']=false;
  u['bidLog/'+(now())]={who:t,v:v,type:'raise'};
  ref.update(u).then(function(){ if(isHost())setTimeout(nextBidTurn,700); });
}
function pass(t,auto){
  var u={};u['teams/'+t+'/passed']=true;u['teams/'+t+'/acted']=true;
  u['bidLog/'+(now())]={who:t,v:teamOf(t).bet||0,type:auto?'timeout':'pass'};
  ref.update(u).then(function(){ if(isHost())setTimeout(nextBidTurn,600); });
}
function finishBid(){
  var r=teamOf('r').bet||0,b=teamOf('b').bet||0,mode,actor;
  if(r>b){mode='A';actor='r';} else if(b>r){mode='A';actor='b';} else {mode='B';actor=null;}
  ref.update({'meta/mode':mode,'meta/actor':actor,'meta/turn':null,
    'meta/phase':'quiz','meta/endsAt':now()+(mode==='B'?30000:30000)});
}
function judge(){
  if(!S.q)return;
  var m=S.meta,q=S.q,res={};
  if(m.mode==='A'){
    var t=m.actor,tl=tally(t),ans=tl.best,ok=(ans===q.answer);
    var gain=SC[q.difficulty],loss=teamOf(t).bet||0;
    res={mode:'A',actor:t,ans:ans,ok:ok,delta:{},ts:now()};
    res.delta[t]= ok? gain : -loss;
  } else {
    var sub=m.submit;
    if(sub&&sub.team){
      var t2=sub.team,tl2=tally(t2),ans2=(sub.ans!=null?sub.ans:tl2.best),ok2=(ans2===q.answer);
      res={mode:'B',actor:t2,ans:ans2,ok:ok2,delta:{},ts:now()};
      if(ok2){res.delta[t2]=SC[q.difficulty];res.delta[other(t2)]=-(teamOf(other(t2)).bet||0);}
      else {res.delta[t2]=-(teamOf(t2).bet||0);
        // 對手補救
        ref.update({'meta/mode':'A','meta/actor':other(t2),'meta/rescue':true,'meta/submit':null,
          'meta/endsAt':now()+15000,'votes':null,'result':{rescueFrom:t2,wrongAns:ans2,ts:now()}});
        return;
      }
    } else {
      // 30 秒都沒人送出：兩隊各自以最高票判定
      var rr=tally('r'),bb=tally('b');
      var okR=rr.best===q.answer, okB=bb.best===q.answer;
      res={mode:'B',actor:null,ans:q.answer,ok:okR||okB,delta:{},both:true,
           ansR:rr.best,ansB:bb.best,ts:now()};
      if(okR&&!okB){res.delta.r=SC[q.difficulty];res.delta.b=-(teamOf('b').bet||0);}
      else if(okB&&!okR){res.delta.b=SC[q.difficulty];res.delta.r=-(teamOf('r').bet||0);}
      else if(okR&&okB){res.delta.r=SC[q.difficulty];res.delta.b=SC[q.difficulty];}
      else {res.delta.r=0;res.delta.b=0;}
    }
  }
  var u={};u['result']=res;u['meta/phase']='result';u['meta/endsAt']=null;
  ['r','b'].forEach(function(t){
    var d=res.delta[t]||0;
    if(d) u['teams/'+t+'/score']=(teamOf(t).score||0)+d;
    if(d>0) u['teams/'+t+'/correct']=(teamOf(t).correct||0)+1;
  });
  ref.update(u);
}
/* ---- 玩家動作 ---- */
function myBet(v){ if(!amLeader())return; ref.update({['teams/'+myTeam()+'/bet']:v}); }
function vote(i){
  var m=S.meta;if(m.phase!=='quiz')return;
  if(myTeam()==='spec')return;
  if(m.mode==='A'&&m.actor!==myTeam())return;
  ref.child('votes/'+uid).set(i);
  ref.update({'meta/soon':null});
}
function submitAnswer(){
  if(!amLeader())return;
  var t=myTeam(),tl=tally(t);if(!tl.any)return;
  ref.child('meta/submit').transaction(function(cur){
    if(cur) return;
    return {team:t,uid:uid,ans:tl.best,ts:now()};
  }).then(function(r){ if(r.committed&&isHost()) setTimeout(judge,300); });
}
/* ---- 渲染 ---- */

  var m=S.meta||{};
  if(m.phase==='lobby'){ renderLobby(); return; }
  if(m.phase==='end'){ renderEnd(); return; }
  $('s-lobby').classList.add('hide');$('s-start').classList.add('hide');$('s-end').classList.add('hide');
  $('s-game').classList.remove('hide');
  renderGame();
}

  $('s-start').classList.add('hide');$('s-game').classList.add('hide');$('s-end').classList.add('hide');

       '<span class="mini">'+(ms.length?'隊長 '+(ms.filter(function(x){return x.p.leader;})[0]||ms[0]).p.name:'—')+'</span></h4><div class="mem">';
    ms.forEach(function(x){ h+='<span class="av '+TC[t].cls+(x.p.leader?' cap':'')+(x.p.online?'':' off')+'">'+x.p.name.slice(0,1)+'</span>'; });
    h+='</div></div>';
  });

  var un=[];for(var k in (S.players||{})){var pp=S.players[k];
    if(pp.team!=='r'&&pp.team!=='b'&&pp.team!=='spec')un.push({uid:k,p:pp});}

  if(sp.length){
    $('specBox').classList.remove('hide');
    var sh='<div style="font-family:var(--mono);font-size:10px;color:var(--dim2);margin-bottom:6px">觀戰 · '+sp.length+' 人</div><div class="mem">';
    sp.forEach(function(x){sh+='<span class="av" style="background:#2a2f4a;color:#c0c8e0'+(x.p.online?'':';opacity:.35')+'">'+x.p.name.slice(0,1)+'</span>';});
    $('specBox').innerHTML=sh+'</div>';
  } else $('specBox').classList.add('hide');
  var iAmSpec=myTeam()==='spec';
  $('toggleSpec').innerHTML=iAmSpec?'我要下場比賽<small>加入人數較少的隊伍</small>'
    :(isHost()?'我要當主持人（不參賽）<small>只看不玩，仍可控制流程</small>':'我要觀戰（不參賽）<small>只看不玩</small>');
  $('hostBox').classList.toggle('hide',!isHost());
  var np=teamMembers('r').length+teamMembers('b').length;
  var total=Object.keys(S.players||{}).length;
  $('lobbyHint').textContent=(isHost()? '房內 '+total+' 人（參賽 '+np+' · 觀戰 '+sp.length+(un.length?' · 待分隊 '+un.length:'')+'）· 把連結傳給朋友'
    : '房內 '+total+' 人（參賽 '+np+' · 觀戰 '+sp.length+'）· 等房主開始遊戲…');
}
function renderGame(){
  var m=S.meta,q=S.q||{};
  $('rnd').textContent=m.round||1;$('rndMax').textContent=m.max;
  $('catIcon').textContent=ICON[q.category]||'?';
  $('catName').textContent=q.category||'—';
  $('catSub').textContent=(m.phase==='quiz'||m.phase==='result')?(DL[q.difficulty]+' · '+fmt(SC[q.difficulty])+' 分'):'難度未公布';
  var sh='';
  ['r','b'].forEach(function(t){
    var T=teamOf(t),mine=myTeam()===t;
    sh+='<div class="srow'+(mine?' me':'')+'"><span class="dot" style="background:'+TC[t].color+'"></span>'+
      '<span style="color:'+TC[t].color+'">'+TC[t].name+(mine?'（你）':'')+'</span>'+
      (m.phase!=='bet'&&T.bet?'<span class="mini">押 '+fmt(T.bet)+'</span>':'')+
      '<span class="val'+((T.score||0)<0?' neg':'')+'">'+fmt(T.score||0)+'</span></div>';
  });
  $('scoreBox').innerHTML=sh;
  ['blkBet','blkBid','blkQuiz','blkResult'].forEach(function(i){$(i).classList.add('hide');});
  var ph=m.phase;
  if(ph==='reveal')   viewReveal();
  else if(ph==='bet') viewBet();
  else if(ph==='bid') viewBid();
  else if(ph==='quiz')viewQuiz();
  else if(ph==='result')viewResult();
  tickCountdown();
  lastPhase=ph;
}
function tickCountdown(){
  var m=S&&S.meta;if(!m)return;
  var el=$('tm');
  if(!m.endsAt){el.textContent='—';el.classList.remove('hot');return;}
  var s=Math.max(0,Math.ceil((m.endsAt-now())/1000));
  el.textContent=s<10?('0'+s):s;el.classList.toggle('hot',s<=3);
}
setInterval(function(){try{tickCountdown();ringTick();}catch(e){}},250);

function stage(lb,sb,turn){$('stLb').textContent=lb;$('stSb').textContent=sb||'';
  $('stage').classList.toggle('turn',!!turn);}
function viewReveal(){ stage('公布領域','這回合考 '+(S.q?S.q.category:'')); if(lastPhase!=='reveal')tone(520,.12); }
function viewBet(){
  if(myTeam()==='spec'){
    stage('暗押中','主持人視角 · 兩隊正在暗押');
    return;
  }
  $('blkBet').classList.remove('hide');
  var T=teamOf(myTeam()),lead=amLeader();
  stage('暗押中',lead?'只有你能碰籌碼':'等隊長下注');
  if(lastPhase!=='bet'){
    var h='';TIERS.forEach(function(v,i){h+='<button class="chip t'+(i+1)+'" data-v="'+v+'"'+(lead?'':' disabled')+'>'+v+'</button>';});
    $('chips').innerHTML=h;
    Array.prototype.forEach.call($('chips').children,function(c){
      c.addEventListener('click',function(){ if(!lead)return;

  $('betHint').textContent=lead?'時間到沒押的話自動押最低 500':'隊長：'+(teamMembers(myTeam()).filter(function(x){return x.p.leader;})[0]||{p:{}}).p.name;

$('betOk').addEventListener('click',function(){ if(!S)return;
  var T=teamOf(myTeam());if(!T.bet){tone(160,.14,'square',.04);return;}
  tone(196,.24,'sine',.07);buzz(30);
  if(isHost()){ var o=teamOf(other(myTeam())); if(o.bet) revealBets(); }
});

  k.addEventListener('click',function(){pass(myTeam());tone(280,.12);box.innerHTML='';});

  if(lastPhase!=='quiz'||$('qText').textContent!==q.question){

    $('opts').innerHTML=h;
    Array.prototype.forEach.call($('opts').children,function(b){
      b.addEventListener('click',function(){ if(!canAns)return; vote(parseInt(b.dataset.i,10));tone(420+parseInt(b.dataset.i,10)*90,.07);buzz(10); });
    });
    startRing();
  }
  stage(m.mode==='B'?'搶答對決':(m.rescue?'補救機會':'作答中'),
        canAns?(m.mode==='B'?'比誰先送出':'全員選完就直接對答案'):'觀戰中 · 你們沒有答題權');
  var votes=S.votes||{};
  [0,1,2,3].forEach(function(i){var el=$('av'+i);if(el)el.innerHTML='';});
  for(var k in votes){
    var p=S.players[k];if(!p)continue;var v=votes[k];if(v==null||v<0)continue;
    if(!spec){
      if(m.mode==='A'&&p.team!==m.actor)continue;
      if(m.mode==='B'&&p.team!==mine)continue;
    }
    var el2=$('av'+v);if(!el2)continue;
    var sp=document.createElement('span');
    sp.className='av '+TC[p.team].cls+(p.leader?' cap':'');sp.textContent=p.name.slice(0,1);
    el2.appendChild(sp);
  }
  Array.prototype.forEach.call($('opts').children,function(b,i){
    b.classList.toggle('sel',votes[uid]===i);
    b.disabled=!canAns;
  });
  if(spec){
    var sr=tally('r'),sb=tally('b'),fmtT=function(x){var o=[];for(var i=0;i<4;i++)if(x.w[i]>0)o.push('ABCD'[i]+' '+x.w[i]);return o.join(' ／ ')||'—';};
    $('voteTxt').textContent='紅 '+fmtT(sr);
    $('oppTxt').textContent='藍 '+fmtT(sb);
    $('submit').classList.add('hide');
    $('quizHint').textContent='主持人視角 · 兩隊的票你都看得到';
    stage(m.mode==='B'?'搶答對決':(m.rescue?'補救機會':'作答中'),'主持人視角');
    return;
  }
  var tl=tally(m.mode==='B'?mine:(m.actor||mine)),s=[];
  for(var i=0;i<4;i++)if(tl.w[i]>0)s.push('ABCD'[i]+' '+tl.w[i]);
  $('voteTxt').textContent=s.join(' ／ ')||'—';
  if(m.mode==='B'){
    var ov=0;teamMembers(other(mine)).forEach(function(x){if(votes[x.uid]!=null&&votes[x.uid]>=0)ov++;});
    $('oppTxt').textContent='對手已投 '+ov+' / '+teamMembers(other(mine)).length;
    $('submit').classList.toggle('hide',!amLeader());
    $('quizHint').textContent=amLeader()?'按下送出就以當下最高票定案':'等你們隊長送出';
  } else {
    $('oppTxt').textContent='';
    $('submit').classList.add('hide');
    $('quizHint').textContent=canAns?(m.soon?'即將送出…（改選可取消）':'全員選完後會有 1.5 秒可以反悔'):'只能看，不能動';
  }
}
$('submit').addEventListener('click',function(){submitAnswer();tone(196,.26,'sine',.07);buzz(30);});
function startRing(){
  var C=2*Math.PI*25;$('ring').setAttribute('stroke-dasharray',String(C));
}
function ringTick(){
  if(!S||!S.meta||S.meta.phase!=='quiz')return;
  var m=S.meta;if(!m.endsAt)return;
  var total=(m.mode==='B'?30:(m.rescue?15:30));
  var left=Math.max(0,(m.endsAt-now())/1000);
  var C=2*Math.PI*25;
  $('ring').setAttribute('stroke-dashoffset',String(C*(1-left/total)));
  $('ring').setAttribute('stroke',left<=5?'#FF3D63':'#22F5DC');
  $('tn').textContent=Math.ceil(left)<10?('0'+Math.ceil(left)):Math.ceil(left);
  $('timer').classList.toggle('hot',left<=5);
}
function viewResult(){
  $('blkQuiz').classList.remove('hide');$('blkResult').classList.remove('hide');
  var q=S.q,res=S.result||{},mine=myTeam();
  Array.prototype.forEach.call($('opts').children,function(b,i){
    b.disabled=true;b.classList.remove('sel');
    b.classList.toggle('ok',i===q.answer);
    b.classList.toggle('no',res.ans===i&&i!==q.answer);
  });
  stage('本題結束','正解已標示在選項上');
  $('tn').textContent='—';$('timer').classList.remove('hot');
  $('ring').setAttribute('stroke','#1a1f36');$('ring').setAttribute('stroke-dashoffset','0');
  $('quizHint').textContent='';$('submit').classList.add('hide');
  var d=(mine==='spec')?0:((res.delta&&res.delta[mine])||0);
  var msg;
  if(mine==='spec'){
    var dr=(res.delta&&res.delta.r)||0, dbb=(res.delta&&res.delta.b)||0;
    msg='紅 '+(dr>0?'+':(dr<0?'−':'±'))+fmt(Math.abs(dr))+'　藍 '+(dbb>0?'+':(dbb<0?'−':'±'))+fmt(Math.abs(dbb));
  } else if(res.both){
    msg=(res.delta.r===0&&res.delta.b===0)?'兩隊都答錯 · 誰都不扣':'時間到 · 以最高票判定';
  } else if(res.actor===mine){
    msg=res.ok?(res.mode==='B'?'搶答成功！':'答對了！'):'答錯了';
  } else {
    msg=res.ok?'對手答對了':'對手答錯了';
  }
  $('resultBox').innerHTML='<div class="center big" style="color:'+(d>0?'var(--green)':(d<0?'var(--red)':'var(--dim)'))+'">'+
    msg+'</div><div class="center" style="font-size:13px;color:var(--dim);margin-top:2px">正解：'+q.options[q.answer]+
    '　<b style="color:'+(d>0?'var(--green)':'var(--red)')+'">'+(d?((d>0?'+':'−')+fmt(Math.abs(d))):'±0')+'</b></div>'+
    '<div class="expl">'+q.explain+'</div>';
  if(lastPhase!=='result'){ flash(d>0);
    if(d>0){tone(523,.12);setTimeout(function(){tone(659,.12);},90);setTimeout(function(){tone(784,.22);},180);buzz([20,40,20]);}
    else if(d<0){tone(220,.18,'sawtooth',.05);setTimeout(function(){tone(150,.3,'sawtooth',.05);},110);buzz(60);}
  }
  $('next').classList.toggle('hide',!isHost());
  $('resHint').textContent=isHost()?'':'等房主按下一回合…';
}
$('next').addEventListener('click',function(){ if(isHost())startRound(); });
function renderEnd(){
  $('s-game').classList.add('hide');$('s-lobby').classList.add('hide');$('s-end').classList.remove('hide');
  var ts=['r','b'].map(function(t){return {t:t,T:teamOf(t)};}).sort(function(a,b){return (b.T.score||0)-(a.T.score||0);});
  var h='';ts.forEach(function(x,i){
    h+='<div class="lrow"'+(i===0?' style="border-color:'+TC[x.t].color+'"':'')+'><span class="pos">'+(i+1)+'</span>'+
      '<span style="color:'+TC[x.t].color+'">'+TC[x.t].name+(myTeam()===x.t?'（你）':'')+'</span>'+
      '<span class="mini">答對 '+(x.T.correct||0)+'</span>'+
      '<span class="sc'+((x.T.score||0)<0?' neg':'')+'">'+fmt(x.T.score||0)+'</span></div>';});
  $('endBox').innerHTML=h;
  var win=ts[0];
  $('endStat').innerHTML='<div class="center big" style="color:'+TC[win.t].color+'">'+TC[win.t].name+' 獲勝</div>'+
    '<div class="center" style="font-size:13px;color:var(--dim)">分差 '+fmt((ts[0].T.score||0)-(ts[1].T.score||0))+' 分</div>';
  $('again').classList.toggle('hide',!isHost());
  if(lastPhase!=='end'){tone(523,.14);setTimeout(function(){tone(659,.14);},130);setTimeout(function(){tone(784,.3);},260);}
  lastPhase='end';
}
$('again').addEventListener('click',function(){
  if(!isHost())return;
  var u={'meta/phase':'lobby','meta/round':0,'meta/endsAt':null,'meta/mode':null,'meta/actor':null,
    'meta/submit':null,'meta/turn':null,'meta/rescue':null,'q':null,'votes':null,'result':null,
    'usedQ':null,'bidLog':null,
    'teams/r/score':10000,'teams/b/score':10000,'teams/r/correct':0,'teams/b/correct':0,
    'teams/r/bet':0,'teams/b/bet':0};
  ref.update(u);
});
$('toggleSpec').addEventListener('click',function(){
  if(!S)return;
  var iAmSpec=myTeam()==='spec';
  if(iAmSpec){
    var t=smallerTeam(S.players);
    var u={};u['players/'+uid+'/team']=t;
    ref.update(u).then(function(){
      var ms=teamMembers(t);
      if(!ms.some(function(x){return x.p.leader;})&&ms.length){
        var uu={};uu['players/'+ms[0].uid+'/leader']=true;ref.update(uu);}
    });
  } else {
    var wasLeader=amLeader(),t0=myTeam();
    var u2={};u2['players/'+uid+'/team']='spec';u2['players/'+uid+'/leader']=false;
    ref.update(u2).then(function(){
      if(wasLeader){var ms=teamMembers(t0).filter(function(x){return x.uid!==uid;});
        if(ms.length){var uu={};uu['players/'+ms[0].uid+'/leader']=true;ref.update(uu);}}
    });
  }
  clink();
});

/* ---- 房主：分隊與開始 ---- */
$('shuffle').addEventListener('click',function(){
  if(!isHost())return;
  var ps=Object.keys(S.players||{}).filter(function(k){return S.players[k].team!=='spec';});
  ps.sort(function(){return Math.random()-.5;});
  var u={};ps.forEach(function(k,i){u['players/'+k+'/team']=(i%2===0)?'r':'b';u['players/'+k+'/leader']=false;});
  ref.update(u).then(function(){
    var uu={};['r','b'].forEach(function(t){var ms=teamMembers(t);if(ms.length)uu['players/'+ms[0].uid+'/leader']=true;});
    ref.update(uu);
  });
  clink();
});
$('start').addEventListener('click',function(){
  if(!isHost())return;
  // 開賽前先把沒隊伍的人自動塞進人數較少的隊
  var pend={},fix={};
  for(var kk in (S.players||{})){var pv=S.players[kk];
    if(pv.team!=='r'&&pv.team!=='b'&&pv.team!=='spec'){pend[kk]=1;}}
  if(Object.keys(pend).length){
    var cr=teamMembers('r').length,cb=teamMembers('b').length;
    Object.keys(pend).forEach(function(kk){
      if(cr<=cb){fix['players/'+kk+'/team']='r';cr++;}else{fix['players/'+kk+'/team']='b';cb++;}
      fix['players/'+kk+'/leader']=false;});
    ref.update(fix);
    net('已把未分隊的人自動加入，再按一次開始',false);setTimeout(function(){net('');},2500);return;
  }
  var r=teamMembers('r').length,b=teamMembers('b').length;
  if(!r||!b){net('紅藍兩隊都要至少 1 人（觀戰者不算），先按重新分隊',true);setTimeout(function(){net('');},3000);return;}
  var u={'meta/max':parseInt($('rounds').value,10),'meta/round':0};
  ['r','b'].forEach(function(t){var ms=teamMembers(t);
    if(!ms.some(function(x){return x.p.leader;})&&ms.length) u['players/'+ms[0].uid+'/leader']=true;});
  ref.update(u).then(function(){ startRound(); });
  tone(660,.1);
});
})();
</script>
